  --teal-dim:rgba(63,199,184,0.14);
  --success:#7ed957;
  --success-dim:rgba(126,217,87,0.14);
  --danger:#ff6b6b;
  --danger-dim:rgba(255,107,107,0.14);
  --radius:14px;
  --disp:'Bebas Neue', sans-serif;
  --mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{color-scheme: light;}
body{
  margin:0;
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,92,57,0.08), transparent),
    var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  padding-bottom:24px;
}
body.has-timerbar{padding-bottom:110px;}
::selection{background:var(--accent);color:#101314;}
/* SCREEN TRANSITIONS (stile iOS push/pop) */
.screen-layer{
  position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,92,57,0.08), transparent),
    var(--bg);
  padding-bottom:24px;
}
body.has-timerbar .screen-layer{padding-bottom:110px;}
.screen-layer.screen-out-forward{animation:screenOutForward .32s cubic-bezier(.32,.72,0,1) forwards;z-index:24;}
.screen-layer.screen-in-forward{animation:screenInForward .32s cubic-bezier(.32,.72,0,1) forwards;z-index:26;}
.screen-layer.screen-out-back{animation:screenOutBack .32s cubic-bezier(.32,.72,0,1) forwards;z-index:26;}
.screen-layer.screen-in-back{animation:screenInBack .32s cubic-bezier(.32,.72,0,1) forwards;z-index:24;}
@keyframes screenInForward{from{transform:translateX(100%);}to{transform:translateX(0);}}
@keyframes screenOutForward{from{transform:translateX(0);filter:brightness(1);}to{transform:translateX(-28%);filter:brightness(.62);}}
@keyframes screenInBack{from{transform:translateX(-28%);filter:brightness(.62);}to{transform:translateX(0);filter:brightness(1);}}
@keyframes screenOutBack{from{transform:translateX(0);}to{transform:translateX(100%);}}
@media (prefers-reduced-motion: reduce){
  .screen-layer.screen-out-forward,.screen-layer.screen-in-forward,.screen-layer.screen-out-back,.screen-layer.screen-in-back{animation:none !important;}
}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;}
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(16,19,20,0.88);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:14px 18px;
  display:flex;align-items:center;gap:12px;
}
.topbar .back{
  width:34px;height:34px;border-radius:50%;
  border:1px solid var(--border-strong);background:var(--bg-card);
  display:flex;align-items:center;justify-content:center;
  color:var(--text);flex-shrink:0;
}
.topbar .back svg{width:16px;height:16px;}
.topbar .titles{flex:1;min-width:0;}
.topbar .eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:0.14em;
  color:var(--accent);text-transform:uppercase;font-weight:700;
}
.topbar h1{
  font-family:var(--disp);font-size:22px;letter-spacing:0.03em;text-transform:uppercase;
  margin:0;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.wrap{max-width:640px;margin:0 auto;padding:20px 18px 0;}
.hero{padding:34px 18px 10px;text-align:left;max-width:640px;margin:0 auto;}
.home-logo{height:42px;width:auto;max-width:180px;display:block;margin-bottom:24px;object-fit:contain;}
.hero .eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:0.16em;color:var(--accent);
  text-transform:uppercase;font-weight:700;margin-bottom:8px;
}
.hero h1{
  font-family:var(--disp);font-size:50px;line-height:0.92;letter-spacing:0.01em;
  margin:0 0 16px;
}
.hero p{color:var(--text-muted);font-size:15px;line-height:1.5;max-width:46ch;margin:0 0 6px;}
.hero .tagline{
  font-family:var(--disp);font-size:24px;line-height:1.15;letter-spacing:.01em;
  text-transform:uppercase;color:var(--text);margin:0 0 14px;
}
.hero .tagline .accent{color:#E0632C;}
.hero .rpe-note{
  margin-top:16px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;font-size:12.5px;color:var(--text-muted);line-height:1.5;
}
.hero .rpe-note b{color:var(--teal);}
.section-label{
  font-family:var(--mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;
  color:var(--text-muted);margin:28px 0 12px;display:flex;align-items:center;gap:10px;
}
.section-label::after{content:"";flex:1;height:1px;background:var(--border);}
.misure-group-label{
  font-family:var(--mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;
  color:var(--accent);font-weight:700;margin:28px 0 12px;display:flex;align-items:center;gap:10px;
}
.misure-group-label::after{content:"";flex:1;height:1px;background:rgba(255,92,57,0.3);}
/* HOME */
.home-grid{display:flex;flex-direction:column;gap:12px;}
.home-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;display:flex;align-items:center;gap:16px;text-align:left;color:var(--text);
  width:100%;
}
.home-card{transition:transform .15s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;}
.home-card:active{
  transform:scale(0.97);
  background:var(--bg-card-hover);
  border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent), 0 0 22px rgba(255,92,57,0.3);
}
.home-card:active .hc-ico{background:var(--accent);color:#101314;}
.home-card .hc-ico{
  width:48px;height:48px;border-radius:12px;background:var(--bg-elev);color:var(--text-muted);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.home-card .hc-ico svg{width:22px;height:22px;}
.home-card .hc-info{flex:1;min-width:0;}
.home-card .hc-title{font-weight:700;font-size:16px;margin-bottom:2px;}
.home-card .hc-sub{font-size:12.5px;color:var(--text-muted);}
.home-card .hc-arrow{color:var(--text-faint);flex-shrink:0;}
.home-card .hc-arrow svg{width:18px;height:18px;}
.cta-next{
  display:block;width:100%;text-align:left;
  background:var(--accent);color:#101314;
  border:none;border-radius:var(--radius);
  padding:18px 52px 18px 20px;margin-bottom:16px;
  position:relative;
}
.cta-next-eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;
  font-weight:700;opacity:0.75;margin-bottom:6px;
}
.cta-next-title{font-family:var(--disp);font-size:24px;letter-spacing:0.02em;line-height:1;margin-bottom:4px;}
.cta-next-sub{font-size:13px;opacity:0.85;}
.cta-next-arrow{position:absolute;right:18px;top:50%;transform:translateY(-50%);}
.cta-next-arrow svg{width:20px;height:20px;}
/* GIORNO GRID */
.giorno-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:10px;}
@media (max-width:420px){.giorno-grid{grid-template-columns:1fr;}}
.giorno-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;text-align:left;color:var(--text);position:relative;overflow:hidden;
}
.giorno-card{transition:transform .15s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;}
.giorno-card:active{
  transform:scale(0.97);
  background:var(--bg-card-hover);
  border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent), 0 0 22px rgba(255,92,57,0.3);
}
.ciclo-prev{transition:transform .15s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;}
.ciclo-prev:active{
  transform:scale(0.97);
  background:var(--bg-card-hover);
  border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent), 0 0 22px rgba(255,92,57,0.3);
}
.giorno-card .gnum{font-family:var(--disp);font-size:15px;color:var(--accent);letter-spacing:.08em;}
.giorno-card .glabel{font-weight:700;font-size:16px;margin:4px 0 2px;}
.giorno-card .gsub{font-size:11.5px;color:var(--text-muted);margin-bottom:8px;}
.giorno-card .gmeta{font-size:11px;color:var(--text-faint);font-family:var(--mono);}
.giorno-card .glast{
  margin-top:10px;padding-top:10px;border-top:1px solid var(--border);
  font-size:11px;color:var(--text-faint);font-family:var(--mono);
}
.giorno-card .glast b{color:var(--teal);font-weight:600;}
/* ============== ALIMENTAZIONE ============== */
.target-banner{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 16px;margin-bottom:18px;
}
.target-banner .tb-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:4px;}
.target-banner .tb-val{font-family:var(--disp);font-size:34px;line-height:1;margin-bottom:4px;}
.target-banner .tb-macro{font-size:12.5px;color:var(--text-muted);font-family:var(--mono);margin-bottom:8px;}
.target-banner .tb-note{font-size:12px;color:var(--text-faint);line-height:1.5;}
.macro-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.macro-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.macro-card .mc-val{font-family:var(--disp);font-size:26px;line-height:1;}
.macro-card .mc-lbl{font-size:10.5px;color:var(--text-muted);font-family:var(--mono);margin-top:5px;text-transform:uppercase;letter-spacing:.05em;}
.macro-card .mc-target{font-size:10.5px;color:var(--text-faint);font-family:var(--mono);margin-top:2px;}
.pasto-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
.pasto-head{padding:14px 16px 12px;border-bottom:1px solid var(--border);}
.pasto-head .pasto-title{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;}
.pasto-head .pasto-name{font-weight:700;font-size:14.5px;margin-top:3px;}
.ing-list{padding:0 16px;}
.ing-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.ing-row:last-child{border-bottom:none;}
.ing-row .ing-main{flex:1;min-width:0;}
.ing-row .ing-name{font-size:13px;font-weight:600;color:var(--text);}
.ing-row .ing-macro{font-size:10.5px;color:var(--text-muted);font-family:var(--mono);margin-top:3px;}
.ing-row .ing-qty-wrap{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.ing-row .ing-qty-wrap input{
  width:54px;background:var(--bg-elev);border:1px solid var(--border);border-radius:8px;
  padding:7px 3px;color:var(--text);font-family:var(--mono);font-size:13px;text-align:center;
}
.ing-row .ing-qty-wrap input:focus{outline:none;border-color:var(--accent);}
.ing-row .ing-unit{font-family:var(--mono);font-size:11px;color:var(--text-faint);width:16px;}
.ing-row .ing-kcal{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:700;flex-shrink:0;width:58px;text-align:right;}
.ing-row{align-items:flex-start;}
.ing-check{
  width:26px;height:26px;border-radius:8px;border:1.5px solid var(--border-strong);
  background:var(--bg-elev);display:flex;align-items:center;justify-content:center;
  flex-shrink:0;color:#101314;margin-top:1px;
}
.ing-check svg{width:13px;height:13px;opacity:0;}
.ing-check.on{background:var(--success);border-color:var(--success);}
.ing-check.on svg{opacity:1;}
.ing-suggested{font-size:10px;color:var(--text-faint);font-family:var(--mono);margin-top:3px;line-height:1.45;}
.ing-suggested .ing-suggested-qty{
  display:inline-block;background:var(--accent-dim);color:var(--accent);
  font-weight:700;font-size:11px;padding:1px 6px;border-radius:6px;margin:1px 0;
}
.pasto-total{
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
  padding:11px 16px;background:var(--bg-elev);font-family:var(--mono);font-size:11.5px;color:var(--text-muted);
}
.pasto-total .pt-kcal{color:var(--text);font-size:13px;}
.alim-badge{color:var(--success);font-weight:700;}
.action-row{display:flex;gap:8px;margin-bottom:20px;}
.action-row .home-card{flex:1;width:auto;padding:14px 6px;justify-content:center;gap:0;}
.action-row .home-card .hc-ico{width:38px;height:38px;}
.action-row .home-card .hc-arrow{display:none;}
.week-strip-card{
  width:100%;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;text-align:left;color:var(--text);margin-bottom:14px;
}
.week-strip{display:flex;gap:5px;margin-bottom:14px;}
.week-day-chip{flex:1;background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;padding:12px 2px;text-align:center;}
.week-day-chip.filled{border-color:var(--accent);background:var(--accent-dim);}
.week-day-chip .wdc-day{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;}
.week-day-chip.filled .wdc-day{color:var(--accent);}
.week-strip-cta{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;color:var(--accent);}
.week-strip-cta svg{width:16px;height:16px;}
.week-day-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:10px;width:100%;text-align:left;color:var(--text);
}
.week-day-row .wdr-day{font-weight:700;font-size:14.5px;flex-shrink:0;width:88px;}
.week-day-row .wdr-info{flex:1;min-width:0;}
.week-day-row .wdr-variant{font-size:13.5px;color:var(--accent);font-weight:700;}
.week-day-row .wdr-variant.unset{color:var(--text-faint);font-weight:400;}
.week-day-row .wdr-sub{font-size:11px;color:var(--text-muted);font-family:var(--mono);margin-top:2px;}
.week-day-row .hc-arrow{color:var(--text-faint);flex-shrink:0;}
.week-day-row .hc-arrow svg{width:18px;height:18px;}
.spesa-group{margin-bottom:22px;}
.spesa-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 0;border-bottom:1px solid var(--border);font-size:13.5px;
}
.spesa-row:last-child{border-bottom:none;}
.spesa-row .sp-name{font-weight:600;}
.spesa-row .sp-qty{font-family:var(--mono);color:var(--accent);font-weight:700;flex-shrink:0;}
.spesa-note-list{font-size:12.5px;color:var(--text-muted);line-height:1.7;}
.profilo-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:6px 16px;margin-bottom:16px;}
.profilo-row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:11px 0;border-bottom:1px solid var(--border);}
.profilo-row:last-child{border-bottom:none;}
.profilo-row .pr-label{font-size:12.5px;color:var(--text-muted);flex-shrink:0;}
.profilo-row .pr-val{font-size:13px;font-weight:600;text-align:right;}
.profilo-row .pr-sub{display:block;font-size:10.5px;font-weight:400;color:var(--text-faint);font-family:var(--mono);margin-top:2px;}
.micronutrienti-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;}
.micro-chip{
  font-family:var(--mono);font-size:11px;padding:6px 11px;border-radius:16px;
  border:1px solid var(--border-strong);background:var(--bg-elev);color:var(--text-muted);
}
.integratore-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}
.integratore-nome{font-weight:700;font-size:14px;margin-bottom:3px;}
.integratore-uso{font-size:12.5px;color:var(--text-muted);line-height:1.5;margin-bottom:6px;}
.integratore-nota{font-size:11.5px;color:var(--teal);line-height:1.5;}
.profilo-disclaimer{font-size:12px;color:var(--text-faint);line-height:1.6;padding:4px 2px 20px;}
.alim-picker-hint{color:var(--text-muted);font-size:13px;line-height:1.5;margin:-6px 0 16px;}
.text-link-btn{
  background:none;border:none;color:var(--text-muted);font-size:12.5px;
  text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;
  padding:2px 2px 24px;display:block;text-align:center;width:100%;
}
.date-bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--bg-card-hover);border:1px solid var(--border-strong);border-radius:var(--radius);
  padding:12px 16px;margin-bottom:18px;
}
.date-bar label{font-size:11px;color:var(--text-muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:3px;}
.date-bar input[type=date]{
  background:transparent;border:none;color:var(--text);font-size:15px;font-weight:600;
  font-family:var(--mono);
}
.date-bar input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.8);}
.save-pill{
  font-family:var(--mono);font-size:11px;padding:6px 12px;border-radius:20px;
  background:var(--success-dim);color:var(--success);border:1px solid transparent;
  white-space:nowrap;opacity:0;transition:opacity .3s;
}
.save-pill.show{opacity:1;}
.warmup-note{
  display:flex;align-items:center;gap:10px;background:var(--teal-dim);border:1px solid rgba(63,199,184,0.25);
  border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:12.5px;color:var(--teal);
}
.warmup-note svg{width:16px;height:16px;flex-shrink:0;}
.info-panel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px;overflow:hidden;}
.info-panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px;cursor:pointer;gap:10px;}
.info-panel-head .iph-title{font-weight:700;font-size:14px;}
.info-panel-head .iph-sub{font-size:12px;color:var(--text-muted);margin-top:3px;}
.info-panel-chev{color:var(--text-faint);transition:transform .2s;flex-shrink:0;}
.info-panel-chev svg{width:16px;height:16px;}
.info-panel-chev.open{transform:rotate(180deg);}
.info-panel-body{max-height:0;overflow:hidden;transition:max-height .35s ease;padding:0 16px;}
.info-panel-body.open{max-height:2400px;padding:0 16px 18px;}
.info-panel-body p{font-size:13px;line-height:1.65;color:var(--text-muted);margin:0 0 13px;}
.info-panel-body p:last-child{margin-bottom:0;}
.info-panel-body b{color:var(--teal);font-weight:600;}
.info-panel-body ul{margin:0 0 13px;padding-left:18px;}
.info-panel-body ul li{font-size:13px;line-height:1.6;color:var(--text-muted);margin-bottom:6px;}
.info-panel-body ul li:last-child{margin-bottom:0;}
.ex-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:12px;overflow:hidden;
}
.ex-head{padding:14px 16px 12px;border-bottom:1px solid var(--border);}
.ex-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.ex-name-btn{
  background:none;border:none;padding:0;text-align:left;color:var(--text);cursor:pointer;
  display:flex;align-items:center;gap:6px;
}
.ex-name-btn .ex-name{
  font-weight:700;font-size:14.5px;line-height:1.3;
  text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--text-faint);
  text-underline-offset:3px;
}
.ex-name-btn .info-ico{color:var(--accent);flex-shrink:0;}
.ex-name-btn .info-ico svg{width:14px;height:14px;}
.ex-name-plain{font-weight:700;font-size:14.5px;line-height:1.3;color:var(--text-muted);}
.ex-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.ex-badge{
  font-family:var(--mono);font-size:10.5px;color:var(--accent);background:var(--accent-dim);
  padding:3px 8px;border-radius:6px;white-space:nowrap;flex-shrink:0;font-weight:600;
}
.ex-badge.rpe{color:var(--teal);background:var(--teal-dim);}
.ex-badge.removed{color:var(--text-faint);background:var(--bg-elev);}
.ex-note{font-size:11.5px;color:var(--text-faint);margin-top:5px;font-style:italic;}
.rec-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 16px;background:var(--bg-elev);font-size:12px;color:var(--text-muted);
}
.rec-row .rlabel{font-family:var(--mono);}
.rec-row .rlabel b{color:var(--text);}
.rec-start{
  display:flex;align-items:center;gap:6px;background:var(--accent-dim);color:var(--accent);
  border:none;border-radius:8px;padding:6px 10px;font-family:var(--mono);font-size:11px;font-weight:700;
}
.rec-start svg{width:11px;height:11px;}
.set-table{padding:6px 16px 12px;}
.set-row{
  display:grid;grid-template-columns:22px 1fr 1fr 1fr 34px;gap:6px;align-items:center;
  padding:6px 0;
}
.set-row .set-idx{
  font-family:var(--mono);font-size:12px;color:var(--text-faint);text-align:center;
}
.set-row input{
  width:100%;background:var(--bg-elev);border:1px solid var(--border);border-radius:8px;
  padding:8px 3px;color:var(--text);font-family:var(--mono);font-size:13.5px;text-align:center;
}
.set-row input[data-f="rpe"]{color:var(--teal);}
.set-row input:focus{outline:none;border-color:var(--accent);}
.set-row .set-done{
  width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border-strong);
  display:flex;align-items:center;justify-content:center;background:var(--bg-elev);
}
.set-row .set-done.on{background:var(--success);border-color:var(--success);}
.set-row .set-done svg{width:15px;height:15px;color:#101314;opacity:0;}
.set-row .set-done.on svg{opacity:1;}
.col-labels{
  display:grid;grid-template-columns:22px 1fr 1fr 1fr 34px;gap:6px;
  font-family:var(--mono);font-size:9.5px;color:var(--text-faint);text-transform:uppercase;
  letter-spacing:.06em;padding:8px 0 4px;
}
.ex-actions{display:flex;gap:8px;padding:0 16px 14px;}
.set-btn{
  flex:1;border:1px dashed var(--border-strong);background:transparent;color:var(--text-muted);
  border-radius:8px;padding:7px;font-size:12px;font-family:var(--mono);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.set-btn svg{width:14px;height:14px;flex-shrink:0;}
.set-btn:active{background:var(--bg-elev);}
.cta{
  display:block;width:100%;background:var(--accent);color:#101314;border:none;
  border-radius:12px;padding:16px;font-weight:800;text-align:center;
  font-family:var(--disp);letter-spacing:.04em;font-size:16px;margin-top:6px;margin-bottom:20px;
}
.cta:active{opacity:.85;}
.toast{
  position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-60px);
  background:var(--success);color:#0e1210;font-family:var(--mono);font-size:12.5px;font-weight:700;
  padding:10px 18px;border-radius:20px;z-index:200;transition:transform .3s ease;
}
.toast.show{transform:translateX(-50%) translateY(0);}
.hidden{display:none !important;}
/* STATS */
.stat-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;}
.stat-summary-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;text-align:left;
}
.stat-summary-card .val{font-family:var(--disp);font-size:32px;color:var(--accent);line-height:1;}
.stat-summary-card .lbl{font-size:11px;color:var(--text-muted);margin-top:4px;font-family:var(--mono);}
.stat-empty{font-size:12px;color:var(--text-faint);font-family:var(--mono);padding:6px 0;}
.stat-meta-row{
  display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);
  font-family:var(--mono);margin-top:6px;
}
.stat-meta-row b{color:var(--text);}
.picker-btn{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--bg-card);border:1px solid var(--border-strong);border-radius:var(--radius);
  padding:15px 16px;color:var(--text);margin-bottom:16px;
}
.picker-btn .pb-left{text-align:left;min-width:0;}
.picker-btn .pb-eyebrow{font-family:var(--mono);font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px;}
.picker-btn .pb-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.picker-btn .pb-chev{color:var(--text-faint);flex-shrink:0;}
.picker-btn .pb-chev svg{width:16px;height:16px;}
.picker-sheet{
  position:fixed;inset:0;z-index:110;background:rgba(8,10,10,0.75);
  display:none;align-items:flex-end;justify-content:center;
}
.picker-sheet.open{display:flex;}
.picker-sheet-inner{
  width:100%;max-width:640px;max-height:78vh;background:var(--bg-elev);
  border-radius:24px 24px 0 0;border:1px solid var(--border-strong);border-bottom:none;
  display:flex;flex-direction:column;animation:slideup .25s ease;
}
@keyframes slideup{from{transform:translateY(100%);}to{transform:translateY(0);}}
.picker-head{
  display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.picker-head h3{margin:0;font-family:var(--disp);font-size:20px;letter-spacing:.02em;}
.picker-head button{background:none;border:none;color:var(--text-faint);}
.picker-head button svg{width:20px;height:20px;}
.picker-scroll{overflow-y:auto;padding:8px 8px 20px;}
.picker-group{margin-top:10px;}
.picker-group-label{
  font-family:var(--mono);font-size:10.5px;color:var(--text-faint);text-transform:uppercase;
  letter-spacing:.1em;padding:8px 12px 6px;
}
.picker-ciclo-label{
  font-family:var(--disp);font-size:16px;letter-spacing:.02em;color:var(--accent);
  padding:14px 12px 2px;
}
.picker-item{
  width:100%;text-align:left;background:none;border:none;color:var(--text-muted);
  padding:12px;border-radius:10px;font-size:14px;display:flex;align-items:center;justify-content:space-between;
}
.picker-item:active{background:var(--bg-card);}
.picker-item.sel{color:var(--accent);background:var(--accent-dim);font-weight:700;}
.picker-item svg{width:15px;height:15px;}
.chart-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 16px 8px;margin-bottom:16px;
}
.chart-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;}
.chart-card-head .name{font-weight:700;font-size:15.5px;}
.chart-card-head .sub{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
.chart-svg-wrap{width:100%;}
.chart-svg-wrap svg{width:100%;height:auto;display:block;}
.chart-axis-line{stroke:var(--border-strong);stroke-width:1;}
.chart-grid-line{stroke:var(--border);stroke-width:1;stroke-dasharray:3,4;}
.chart-tick-label{font-family:var(--mono);fill:var(--text-faint);font-size:9px;}
.chart-point-label{font-family:var(--mono);fill:var(--text-muted);font-size:9px;}
.range-row{display:flex;gap:10px;margin-bottom:10px;}
.range-field{
  flex:1;background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;padding:9px 10px;
}
.range-field label{display:block;font-size:9.5px;color:var(--text-faint);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px;}
.range-field input[type=date]{background:none;border:none;color:var(--text);font-family:var(--mono);font-size:12.5px;width:100%;}
.range-field input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.8);}
.range-chips{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.range-chip{
  font-family:var(--mono);font-size:11px;padding:6px 11px;border-radius:16px;
  border:1px solid var(--border-strong);background:var(--bg-elev);color:var(--text-muted);
}
.range-chip.active{background:var(--accent);color:#101314;border-color:var(--accent);font-weight:700;}
/* CRONOLOGIA */
.month-group{margin-bottom:22px;}
.month-title{
  font-family:var(--disp);font-size:20px;letter-spacing:.02em;color:var(--text);margin-bottom:10px;
}
.session-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--bg-card);border:1px solid var(--border);border-radius:12px;
  padding:13px 14px;margin-bottom:8px;cursor:pointer;
}
.session-row:active{background:var(--bg-card-hover);}
.session-row .sr-left{display:flex;align-items:center;gap:12px;min-width:0;}
.session-row .sr-date{
  font-family:var(--disp);font-size:22px;color:var(--accent);width:40px;text-align:center;line-height:1;flex-shrink:0;
}
.session-row .sr-info{min-width:0;}
.session-row .sr-giorno{font-weight:700;font-size:13.5px;}
.session-row .sr-meta{font-size:11px;color:var(--text-muted);font-family:var(--mono);}
.session-row .sr-del,.session-row .sr-edit{
  width:34px;height:34px;border-radius:8px;flex-shrink:0;border:1px solid var(--border-strong);
  background:var(--bg-elev);color:var(--text-faint);display:flex;align-items:center;justify-content:center;
}
.session-row .sr-del svg,.session-row .sr-edit svg{width:15px;height:15px;}
.cron-empty{text-align:center;padding:60px 20px;color:var(--text-faint);font-size:13.5px;}
/* SWIPE TO DELETE */
.swipe-wrap{position:relative;overflow:hidden;border-radius:12px;margin-bottom:8px;}
.swipe-wrap .session-row,.swipe-wrap .measure-row{margin-bottom:0;}
.swipe-action-bg{
  position:absolute;top:0;right:0;bottom:0;width:92px;
  background:var(--danger);color:#1a0a0a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-family:var(--mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
}
.swipe-action-bg svg{width:17px;height:17px;}
.swipe-surface{position:relative;transform:translateX(0);transition:transform .22s cubic-bezier(.32,.72,0,1);touch-action:pan-y;cursor:grab;}
.swipe-surface:active{cursor:grabbing;}
.swipe-wrap.swiped .swipe-surface{transform:translateX(-92px);}
.swipe-hint{
  text-align:center;font-size:11px;color:var(--text-faint);font-family:var(--mono);
  margin:-6px 0 14px;
}
/* INFO SHEET (technique popup) */
.info-sheet{
  position:fixed;inset:0;z-index:120;background:rgba(8,10,10,0.75);
  display:none;align-items:flex-end;justify-content:center;
}
.info-sheet.open{display:flex;}
.info-sheet-inner{
  width:100%;max-width:640px;max-height:85vh;background:var(--bg-elev);
  border-radius:24px 24px 0 0;border:1px solid var(--border-strong);border-bottom:none;
  display:flex;flex-direction:column;animation:slideup .25s ease;
}
.info-head{
  display:flex;align-items:flex-start;justify-content:space-between;padding:20px 20px 14px;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.info-head h3{margin:0;font-family:var(--disp);font-size:24px;letter-spacing:.02em;line-height:1;}
.info-head button{background:none;border:none;color:var(--text-faint);flex-shrink:0;margin-left:10px;}
.info-head button svg{width:20px;height:20px;}
.info-scroll{overflow-y:auto;padding:16px 20px 28px;}
.info-block{margin-bottom:18px;}
.info-block:last-child{margin-bottom:0;}
.info-block-label{
  display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--accent);
  text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:6px;
}
.info-block-label svg{width:14px;height:14px;}
.info-block p{margin:0;font-size:13.5px;line-height:1.6;color:var(--text-muted);}
/* CONFIRM MODAL */
.confirm-overlay{
  position:fixed;inset:0;z-index:200;background:rgba(8,10,10,0.8);
  display:none;align-items:center;justify-content:center;padding:24px;
}
.confirm-overlay.open{display:flex;}
.confirm-box{
  background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:16px;
  padding:22px;max-width:340px;width:100%;text-align:center;
}
.confirm-box p{font-size:14px;color:var(--text);margin:0 0 18px;line-height:1.5;}
.confirm-actions{display:flex;gap:10px;}
.confirm-actions button{
  flex:1;padding:11px;border-radius:10px;font-family:var(--mono);font-size:13px;font-weight:700;border:none;
}
.confirm-cancel{background:var(--bg-card);color:var(--text-muted);border:1px solid var(--border-strong) !important;}
.confirm-ok{background:var(--danger);color:#1a0a0a;}
/* TIMER BAR */
.timer-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(24,28,30,0.95);backdrop-filter:blur(14px);
  border-top:1px solid var(--border-strong);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
}
.timer-bar-inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;}
.mini-timer{
  display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--text);
  padding:4px 8px 4px 4px;border-radius:12px;flex:1;min-width:0;text-align:left;
}
.mini-timer:active{background:var(--bg-card-hover);}
.mini-ring{flex-shrink:0;transform:rotate(-90deg);}
.mini-ring-bg{fill:none;stroke:var(--border-strong);stroke-width:4;}
.mini-ring-fg{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;transition:stroke .3s;}
.mini-timer-text{display:flex;flex-direction:column;min-width:0;}
.mini-timer-time{font-family:var(--mono);font-size:16px;font-weight:700;line-height:1.15;}
.mini-timer-label{
  font-family:var(--mono);font-size:9.5px;color:var(--text-muted);text-transform:uppercase;
  letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.timer-start.mini-toggle{margin-left:0;width:38px;height:38px;}
.timer-minimize-hint{
  font-size:11.5px;color:var(--text-muted);text-align:center;max-width:34ch;
  margin:-2px 0 14px;line-height:1.4;
}
.timer-label{
  font-family:var(--mono);font-size:10px;color:var(--text-faint);text-transform:uppercase;
  letter-spacing:.1em;margin-right:2px;
}
.chip{
  font-family:var(--mono);font-size:12.5px;padding:9px 12px;border-radius:20px;
  border:1px solid var(--border-strong);background:var(--bg-elev);color:var(--text-muted);
  flex-shrink:0;
}
.chip.active{background:var(--accent);color:#101314;border-color:var(--accent);font-weight:700;}
.timer-start{
  margin-left:auto;flex-shrink:0;width:44px;height:44px;border-radius:50%;
  background:var(--accent);border:none;display:flex;align-items:center;justify-content:center;
  color:#101314;
}
.timer-start svg{width:18px;height:18px;}
.timer-sheet{
  position:fixed;inset:0;z-index:130;background:rgba(8,10,10,0.7);
  display:none;align-items:flex-end;justify-content:center;
}
.timer-sheet.open{display:flex;}
.timer-sheet-inner{
  width:100%;max-width:640px;background:var(--bg-elev);
  border-radius:24px 24px 0 0;border:1px solid var(--border-strong);border-bottom:none;
  padding:28px 24px calc(28px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;
  animation:slideup .25s ease;
}
.timer-sheet-close{align-self:flex-end;color:var(--text-faint);background:none;border:none;padding:0 0 10px;}
.timer-sheet-close svg{width:20px;height:20px;}
.timer-source{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-bottom:4px;text-align:center;}
.ring-wrap{position:relative;width:230px;height:230px;margin:6px 0 20px;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--border);stroke-width:12;}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;transition:stroke .3s;}
.ring-fg.done{stroke:var(--success);}
.ring-center{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.ring-time{font-family:var(--mono);font-size:44px;font-weight:700;letter-spacing:-0.02em;}
.ring-status{font-family:var(--mono);font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;margin-top:4px;}
.timer-controls{display:flex;align-items:center;gap:10px;}
.tc-btn{
  width:52px;height:52px;border-radius:50%;border:1px solid var(--border-strong);
  background:var(--bg-card);color:var(--text);display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:13px;font-weight:700;
}
.tc-btn svg{width:18px;height:18px;}
.tc-main{
  width:64px;height:64px;background:var(--accent);border:none;color:#101314;
}
.tc-main svg{width:24px;height:24px;}
.tc-small{width:40px;height:40px;margin-left:6px;color:var(--text-muted);}
.tc-small svg{width:15px;height:15px;}
/* AUTH */
.auth-wrap{max-width:420px;margin:0 auto;padding:60px 20px 40px;}
.auth-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;font-weight:700;margin-bottom:8px;}
.auth-wrap h1{font-family:var(--disp);font-size:40px;line-height:0.95;margin:0 0 8px;}
.auth-wrap .auth-sub{color:var(--text-muted);font-size:14px;line-height:1.5;margin:0 0 24px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;color:var(--text-muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.field input{
  width:100%;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:10px;
  padding:13px 14px;color:var(--text);font-size:15px;
}
.field input:focus{outline:none;border-color:var(--accent);}
.auth-error{background:var(--danger-dim);color:var(--danger);border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;display:none;}
.auth-error.show{display:block;}
.auth-info{background:var(--teal-dim);color:var(--teal);border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;display:none;}
.auth-info.show{display:block;}
.auth-switch{text-align:center;margin-top:18px;font-size:13px;color:var(--text-muted);}
.auth-switch a{color:var(--accent);font-weight:700;text-decoration:none;cursor:pointer;}
.auth-forgot{text-align:right;margin:-6px 0 18px;}
.auth-forgot a{color:var(--text-muted);font-size:12.5px;text-decoration:none;cursor:pointer;}
.logout-link{
  position:fixed;top:38px;right:18px;z-index:45;
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-faint);background:var(--bg-card);
  border:1px solid var(--border-strong);text-decoration:none;
}
.logout-link svg{width:16px;height:16px;}
.home-back-btn{
  position:fixed;top:38px;left:18px;z-index:45;
  width:34px;height:34px;border-radius:50%;
  border:1px solid var(--border-strong);background:var(--bg-card);
  display:flex;align-items:center;justify-content:center;color:var(--text);
}
.home-back-btn svg{width:16px;height:16px;}
/* MISURE (contrasto piu' netto + tocchi di arancione del brand) */
.measure-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.measure-field{background:var(--bg-card-hover);border:1px solid rgba(255,92,57,0.3);border-radius:12px;padding:12px;}
.measure-field label{display:block;font-size:11.5px;color:var(--accent);font-weight:700;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;margin-bottom:0;}
.measure-field .mf-label-row{display:block;margin-bottom:7px;}
.measure-field .mf-tip{display:block;font-size:11px;line-height:1.45;color:var(--text-muted);margin-top:9px;padding-top:9px;border-top:1px dashed var(--border-strong);}
.measure-field .mf-row{display:flex;align-items:center;gap:6px;}
.measure-field input{
  width:100%;background:var(--bg);border:1px solid var(--border-strong);border-radius:8px;
  padding:10px 8px;color:var(--accent);font-family:var(--mono);font-size:16px;font-weight:700;text-align:center;
}
.measure-field input:focus{outline:none;border-color:var(--accent);}
.measure-field input::placeholder{color:var(--text-faint);}
.measure-field .mf-unit{font-family:var(--mono);font-size:11.5px;color:var(--accent);font-weight:700;flex-shrink:0;}
.measure-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--bg-card-hover);border:1px solid var(--border-strong);border-left:3px solid var(--accent);border-radius:12px;
  padding:13px 14px;margin-bottom:8px;
}
.measure-row .mr-date{font-weight:700;font-size:14.5px;color:var(--accent);}
.measure-row .mr-vals{font-size:11.5px;color:var(--text);font-family:var(--mono);margin-top:2px;}
/* TABS */
.tab-row{display:flex;gap:8px;margin-bottom:20px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:4px;}
.tab-btn{flex:1;background:none;border:none;color:var(--text-muted);font-family:var(--mono);font-size:12.5px;font-weight:700;padding:10px;border-radius:9px;text-transform:uppercase;letter-spacing:.04em;}
.tab-btn.active{background:var(--accent);color:#101314;}
.tab-btn{transition:background .15s ease, color .15s ease;}
.tab-btn:active:not(.active){background:var(--bg-card-hover);color:var(--text);}
</style>

/* ============== STORAGE ADAPTER (Firestore, per utente) ==============
   Ogni utente autenticato ha una collezione privata users/{uid}/kv. L'adapter
   espone la stessa identica forma (set/get/delete/list) di prima: tutta la
   logica dell'app sotto resta invariata. I dati vivono nel cloud legati
   all'account, quindi non si perdono cambiando telefono, browser o
   cancellando la cronologia di Safari. */
window.storage = {
  _col(){
    if(!currentUser) throw new Error('Utente non autenticato');
    return db.collection('users').doc(currentUser.uid).collection('kv');
  },
  /* set/delete NON inghiottono piu' gli errori al loro interno: se il
     salvataggio su Firestore fallisce (telefono offline, connessione
     instabile in palestra, ecc.) l'errore risale a chi ha chiamato la
     funzione, cosi' l'interfaccia puo' mostrare "Errore salvataggio" invece
     di dire "Salvato ✓" quando in realta' non e' stato salvato nulla. */
  async set(key, value, _unused){
    await this._col().doc(key).set({ value });
    return true;
  },
  async get(key, _unused){
    try{
      const snap = await this._col().doc(key).get();
      return snap.exists ? { value: snap.data().value } : null;
    }catch(e){ return null; }
  },
  async delete(key, _unused){
    await this._col().doc(key).delete();
    return true;
  },
  async list(prefix, _unused){
    try{
      const end = prefix + '';
      const q = await this._col()
        .where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
        .where(firebase.firestore.FieldPath.documentId(), '<', end)
        .get();
      return { keys: q.docs.map(d=>d.id) };
    }catch(e){ return { keys: [] }; }
  }
};
/* "Oggi" in data locale (fuso orario del telefono), non UTC: usando
   new Date().toISOString() la data cambierebbe a mezzanotte UTC, cioe'
   all'1 o alle 2 di notte in Italia — un allenamento o un pasto registrati
   subito dopo mezzanotte locale finirebbero salvati sotto la data di ieri. */
function todayLocalISO(){
  const d = new Date();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${d.getFullYear()}-${mm}-${dd}`;
}

/* Il conteggio del timer si basa sull'orario reale (endTime), non sul numero
   di "tick" del setInterval: quando l'app va in background (es. passi su
   Instagram), i browser rallentano o sospendono i timer JS, quindi un
   countdown che si limita a decrementare ad ogni tick andrebbe indietro
   rispetto al tempo vero. Calcolando invece il tempo rimanente come
   "endTime - adesso" ad ogni tick e soprattutto al rientro in app
   (visibilitychange/focus), il timer si "recupera" da solo e mostra il
   valore corretto — e se il tempo era gia' scaduto mentre eri fuori
   dall'app, scatta suono/vibrazione non appena rientri. */
function recalcTimerFromEndTime(){
  if(!timer.running || !timer.endTime) return;
  const remain = Math.max(0, Math.round((timer.endTime - Date.now())/1000));
  timer.remaining = remain;
  if(remain <= 0) finishTimer();
  else { updateRing(); renderTimerBar(); }
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') recalcTimerFromEndTime(); });

   affidabile solo se e' stato "sbloccato" da un gesto diretto dell'utente
   (un tap). Creandolo/riattivandolo al tap che avvia il timer (vedi
   startTimer) invece che al momento dello scadere (che arriva da un
   setInterval, non da un tap), il suono di fine recupero ha molte piu'
   probabilita' di sentirsi davvero, anche con le cuffie e musica in corso. */
let sharedAudioCtx = null;
function unlockAudioCtx(){
  try{
    if(!sharedAudioCtx) sharedAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume().catch(()=>{});

  return sharedAudioCtx;
}

/* ============== TRANSIZIONI TRA SCHERMATE (stile iOS push/pop) ==============
   Ogni renderX() continua a fare semplicemente `app.innerHTML = ...`: qui
   intercettiamo quell'assegnazione sulla singola istanza #app per animare
   l'uscita della schermata precedente e l'ingresso di quella nuova, senza
   dover toccare tutte le funzioni di rendering. La direzione (avanti/indietro)
   viene dedotta da una piccola pila di schermate visitate. */
(function(){
  const nativeDesc = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
  let screenStack = [];
  let pendingCleanup = null;
  function directionFor(newScreen){
    if(!newScreen) return 'forward';
    const prevIdx = screenStack.length - 2;
    if(prevIdx >= 0 && screenStack[prevIdx] === newScreen){
      screenStack.pop();
      return 'back';
    }
    screenStack.push(newScreen);
    return 'forward';
  }
  function reducedMotion(){
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }
  Object.defineProperty(app, 'innerHTML', {
    configurable:true,
    get(){ return nativeDesc.get.call(app); },
    set(html){
      if(pendingCleanup){ pendingCleanup(); pendingCleanup = null; }
      const isFirstPaint = app.childNodes.length === 0;
      if(isFirstPaint || reducedMotion()){
        nativeDesc.set.call(app, html);
        if(typeof state !== 'undefined' && state.screen) screenStack.push(state.screen);
        return;
      }
      const dir = directionFor(typeof state !== 'undefined' ? state.screen : null);
      const outgoing = document.createElement('div');
      outgoing.className = 'screen-layer';
      while(app.firstChild) outgoing.appendChild(app.firstChild);
      /* Le due schermate (uscente ed entrante) convivono nel DOM per tutta
         la durata dell'animazione. Se condividono lo stesso id (es. "btnBack"),
         un document.getElementById(...) eseguito subito dopo questa riga
         (come fa ogni funzione renderX per agganciare i click) troverebbe
         l'elemento della schermata VECCHIA invece di quella nuova, lasciando
         il pulsante visibile senza alcun gestore di click. Rimuoviamo quindi
         gli id dalla schermata uscente, che sta comunque per essere distrutta. */
      outgoing.querySelectorAll('[id]').forEach(el => el.removeAttribute('id'));
      nativeDesc.set.call(app, html);
      const incoming = document.createElement('div');
      incoming.className = 'screen-layer';
      while(app.firstChild) incoming.appendChild(app.firstChild);
      app.appendChild(outgoing);
      app.appendChild(incoming);
      outgoing.classList.add(dir === 'back' ? 'screen-out-back' : 'screen-out-forward');
      incoming.classList.add(dir === 'back' ? 'screen-in-back' : 'screen-in-forward');
      let done = false;
      const cleanup = ()=>{
        if(done) return;
        done = true;
        if(pendingCleanup === cleanup) pendingCleanup = null;
        if(outgoing.parentNode) outgoing.remove();
        if(incoming.parentNode){
          while(incoming.firstChild) app.appendChild(incoming.firstChild);
          incoming.remove();
        }
      };
      pendingCleanup = cleanup;
      incoming.addEventListener('animationend', cleanup, { once:true });
      setTimeout(cleanup, 420);
    }
  });
})();

/* ============== SWIPE TO DELETE ==============
   Attivata sulle righe di Storico allenamenti e Storico misure: swipe verso
   sinistra rivela il pulsante rosso "Elimina" (o, se lo swipe è deciso,
   elimina direttamente) — lo stesso identico flusso di conferma già usato
   dal pulsante cestino, quindi resta sempre richiesta una conferma. */
const SWIPE_REVEAL = 92;
function enableSwipe(wrapEl, onDelete){
  const surface = wrapEl.querySelector('.swipe-surface');
  if(!surface) return;
  /* Pointer Events copre sia il touch (telefono) sia il mouse (desktop/anteprima
     browser): senza questo, trascinare con il mouse non avrebbe fatto nulla. */
  let startX=0, startY=0, dx=0, dragging=false, decided=false, horizontal=false, pid=null;
  function start(e){
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    if(e.target.closest('.sr-del') || e.target.closest('.sr-edit')) return; /* lascia i pulsanti liberi dal gesto di swipe */
    pid = e.pointerId;
    startX = e.clientX; startY = e.clientY; dx = 0; dragging = true; decided=false; horizontal=false;
    surface.style.transition = 'none';
    try{ surface.setPointerCapture(pid); }catch(err){}
  }
  function move(e){
    if(!dragging || e.pointerId !== pid) return;
    dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if(!decided){
      if(Math.abs(dx) > 6 || Math.abs(dy) > 6){ decided = true; horizontal = Math.abs(dx) > Math.abs(dy); }
    }
    if(!horizontal) return;
    if(e.cancelable) e.preventDefault();
    const base = wrapEl.classList.contains('swiped') ? -SWIPE_REVEAL : 0;
    let x = base + dx;
    x = Math.max(-SWIPE_REVEAL*1.15, Math.min(0, x));
    surface.style.transform = `translateX(${x}px)`;
  }
  function end(e){
    if(!dragging) return;
    dragging = false;
    if(pid !== null){ try{ surface.releasePointerCapture(pid); }catch(err){} }
    surface.style.transition = '';
    const base = wrapEl.classList.contains('swiped') ? -SWIPE_REVEAL : 0;
    const finalX = base + dx;
    if(decided && horizontal && finalX < -SWIPE_REVEAL*0.85){
      wrapEl.classList.remove('swiped');
      surface.style.transform = 'translateX(0)';
      onDelete();
    } else if(finalX < -SWIPE_REVEAL*0.35){
      wrapEl.classList.add('swiped');
      surface.style.transform = `translateX(-${SWIPE_REVEAL}px)`;

      surface.style.transform = 'translateX(0)';
    }
  }
  surface.addEventListener('pointerdown', start);
  surface.addEventListener('pointermove', move);
  surface.addEventListener('pointerup', end);
  surface.addEventListener('pointercancel', end);

  if(bg) bg.addEventListener('click', (e)=>{ e.stopPropagation(); onDelete(); });

function logKey(giornoId,sessionId){ return `log-v2-${giornoId}-${sessionId}`; }
function generateSessionId(){ return 's'+Date.now()+'_'+Math.random().toString(36).slice(2,8); }
function sessionTimeLabel(sessionId){
  if(!sessionId || !sessionId.startsWith('s')) return '';
  try{
    const ts = parseInt(sessionId.split('_')[0].slice(1));
    if(isNaN(ts)) return '';
    const label = new Date(ts).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});

function blankLog(giorno){

   background mentre scrivi kg/ripetizioni/RPE: salva ma NON mostra il
   banner verde, che deve comparire solo quando premi "Salva sessione". */
async function saveLog(showBanner, message){
  if(!state.log) return;

    await window.storage.set(logKey(state.giornoId,state.sessionId), JSON.stringify(state.log), false);

function flashSavePill(){

/* Returns [{sessionId, date, log}] for a giorno (by id), most recent first.
   Le letture delle singole sessioni partono tutte in parallelo (Promise.all)
   invece che una alla volta in sequenza: con molte sessioni salvate il
   caricamento è nettamente più veloce. */
async function listSessionsDetailed(giornoId){
  try{
    const prefix = `log-v2-${giornoId}-`;
    const res = await window.storage.list(prefix, false);
    if(!res || !res.keys) return [];
    const results = await Promise.all(res.keys.map(async (k)=>{
      const sessionId = k.slice(prefix.length);
      try{
        const r = await window.storage.get(k, false);
        if(r && r.value){
          const log = JSON.parse(r.value);
          const date = log.date || todayLocalISO();
          return { sessionId, date, log };
        }
      }catch(e){}
      return null;
    }));
    const items = results.filter(Boolean);
    items.sort((a,b)=> b.date.localeCompare(a.date) || b.sessionId.localeCompare(a.sessionId));
    return items;
  }catch(e){ return []; }
}
async function lastSessionDate(giornoId){
  const list = await listSessionsDetailed(giornoId);
  return list.length ? list[0].date : null;
}
async function deleteSession(giornoId, sessionId){
  await window.storage.delete(logKey(giornoId,sessionId), false);
}

async function listMeasureEntries(){

      if(r && r.value){
        try{ return { key:k, ...JSON.parse(r.value) }; }catch(e){}

async function getMeasureTypeHistory(type){
  const entries = await listMeasureEntries();
  const points = [];

    const cm = parseFloat(v);
    if(v !== undefined && v !== '' && !isNaN(cm)) points.push({ date:e.date, cm, key:e.key });
  });
  points.sort((a,b)=> a.date.localeCompare(b.date));

}

/* Cerca, tra tutte le sessioni salvate (di tutti i giorni/cicli), una bozza
   non ancora conclusa (finalized:false). Il controllo e' scritto in positivo
   (=== false, non !== true): una sessione salvata da PRIMA che questo campo
   esistesse non ha la chiave "finalized" e va trattata come gia' conclusa,
   non come bozza aperta — altrimenti ogni sessione storica pre-esistente
   comparirebbe come "da riprendere". Se ce ne sono piu' d'una (caso raro),
   prende la piu' recente: getAllSessionsRaw ordina gia' per data e sessionId
   decrescenti. */
async function findOpenSession(){
  try{
    const raw = await getAllSessionsRaw();
    return raw.find(s => s.log && s.log.finalized === false) || null;
  }catch(e){ return null; }
}
async function loadAllenamentoSummary(){
  const btnNext = document.getElementById('btnNext');
  const btnRestart = document.getElementById('btnRestartAllenamento');
  if(!btnNext) return;
  const open = await findOpenSession();
  if(open){
    document.getElementById('ctaNextEyebrow').textContent = 'Stai registrando';
    document.getElementById('ctaNextTitle').textContent = `${open.giorno.label} — ${open.giorno.meta}`;
    document.getElementById('ctaNextSub').textContent = 'Tocca per continuare a registrare';
    btnNext.style.display = '';
    btnNext.onclick = ()=> openExistingSession(open.giornoId, open.sessionId, 'allenamento');
    if(btnRestart){
      btnRestart.style.display = '';
      btnRestart.onclick = ()=>{
        showConfirm('Eliminare la sessione in corso? I dati inseriti finora andranno persi.', async ()=>{
          try{ await deleteSession(open.giornoId, open.sessionId); loadAllenamentoSummary(); }
          catch(e){ showToast('Errore — riprova'); }
        }, 'Elimina', 'Annulla');
      };
    }
    return;
  }
  if(btnRestart) btnRestart.style.display = 'none';
  document.getElementById('ctaNextEyebrow').textContent = 'Prossimo allenamento';
  const ciclo = cicloAttuale();
  if(!ciclo || !ciclo.giorni.length){ btnNext.style.display = 'none'; return; }
  const withLast = await Promise.all(ciclo.giorni.map(async g=>({
    giorno:g, last: await lastSessionDate(g.id)
  })));
  let mostRecentIdx = -1, mostRecentDate = null;
  withLast.forEach((x,i)=>{
    if(x.last && (!mostRecentDate || x.last > mostRecentDate)){ mostRecentDate = x.last; mostRecentIdx = i; }
  });
  const nextIdx = mostRecentIdx === -1 ? 0 : (mostRecentIdx + 1) % ciclo.giorni.length;
  const next = ciclo.giorni[nextIdx];
  document.getElementById('ctaNextTitle').textContent = `${next.label} — ${next.meta}`;
  document.getElementById('ctaNextSub').textContent = next.sub;
  btnNext.style.display = '';
  btnNext.onclick = ()=> startNewWorkout(next.id);
}

   la giornata: la voce resta una "bozza" e riapre la stessa variante se chiudi e
   riapri l'app. finalized=true solo quando premi "Salva registrazione": da quel
   momento la giornata e' considerata conclusa e non viene piu' riproposta in
   automatico (resta comunque modificabile dallo Storico). */
async function saveAlimEntry(date, giornoId, quantities, finalized){
  await window.storage.set(alimKey(date), JSON.stringify({ date, giornoId, quantities, finalized: !!finalized }), false);
}
async function listAlimEntries(){
  try{
    const res = await window.storage.list('alim-v1-', false);
    if(!res || !res.keys) return [];
    const results = await Promise.all(res.keys.map(async (k)=>{
      try{
        const r = await window.storage.get(k, false);
        if(r && r.value) return { key:k, ...JSON.parse(r.value) };
      }catch(e){}
      return null;
    }));
    return results.filter(Boolean);
  }catch(e){ return []; }
}
async function deleteAlimEntry(date){

/* Somma le quantita' di ogni ingrediente sui giorni assegnati nella
   settimana: colazione/spuntini/pranzo vengono presi da ALIM_GIORNI (gia'
   in porzione singola), la cena viene presa da ALIM_CENE_RICETTE (gia' in
   "tua quantita'", vedi commento li' sopra — mai raddoppiata qui).
   Il raggruppamento e' per NOME ingrediente (non piu' nome+unita'): se lo
   stesso alimento compare sia in grammi che in millilitri (capita solo con
   l'albume d'uovo, che ha densita' praticamente identica all'acqua), i due
   totali si sommano in un unico valore in grammi trattando 1 ml come 1 g —
   un'approssimazione ragionevole per una lista della spesa, che altrimenti
   mostrerebbe due righe separate per lo stesso ingrediente. Le altre unita'
   non standard (uova, tortillas, lattina, scalogno) restano sempre distinte
   per nome, dato che non compaiono mai miste con grammi/millilitri. */
/* Alcuni ingredienti hanno nomi diversi da ricetta a ricetta ma per la spesa
   sono la stessa cosa da comprare (i pomodorini sono comunque pomodori):
   li uniamo SOLO qui, per la lista della spesa — nei dati dei singoli pasti
   (tracking, Menu di consultazione) restano con il nome specifico della
   ricetta, che li' resta utile. */
const ALIM_SPESA_SINONIMI = {
  'Pomodorini': 'Pomodori',
};
function computeListaSpesa(settimana){
  const byName = {}; // nome -> { g:0, ml:0, other: {unit: qty} }
  const notes = [];
  const seenCene = new Set();
  let assignedCount = 0;
  function addQty(name, unit, qty){
    name = ALIM_SPESA_SINONIMI[name] || name;
    if(!byName[name]) byName[name] = { g:0, ml:0, other:{} };
    const entry = byName[name];
    if(unit === 'g' || unit === 'ml') entry[unit] += qty;
    else entry.other[unit] = (entry.other[unit]||0) + qty;
  }
  ALIM_SETTIMANA_GIORNI.forEach(d=>{
    const gid = settimana[d.key];
    if(!gid) return;
    assignedCount++; // "Niente" conta come giorno assegnato (e' una scelta consapevole)
    if(gid === ALIM_NIENTE_ID) return; // nessun pasto pianificato: niente ingredienti da aggiungere
    const giorno = ALIM_GIORNI.find(g=>g.id===gid);
    if(!giorno) return;
    giorno.pasti.forEach(pasto=>{
      if(pasto.id === 'cena'){
        const ricetta = ALIM_CENE_RICETTE[pasto.nome];
        if(!ricetta) return; // per sicurezza, se mai mancasse una ricetta non blocchiamo il resto
        ricetta.ingredienti.forEach(ing=> addQty(ing.n, ing.unit, ing.qty));
        if(ricetta.note && !seenCene.has(pasto.nome)){
          notes.push(`${pasto.nome.replace(' (tua porzione)','')}: ${ricetta.note}`);
          seenCene.add(pasto.nome);
        }
        return;
      }
      pasto.ingredienti.forEach(ing=> addQty(ing.n, ing.unit, ing.def));
    });
  });
  const items = [];
  Object.keys(byName).forEach(name=>{
    const entry = byName[name];
    if(entry.g > 0 && entry.ml > 0){
      /* presente sia in grammi che in millilitri: le uniamo in un'unica
         riga in grammi (1 ml ~= 1 g) invece di mostrarle separate */
      items.push({ n:name, unit:'g', qty: entry.g + entry.ml });
    } else if(entry.g > 0){
      items.push({ n:name, unit:'g', qty: entry.g });
    } else if(entry.ml > 0){
      items.push({ n:name, unit:'ml', qty: entry.ml });
    }
    Object.keys(entry.other).forEach(unit=>{
      items.push({ n:name, unit, qty: entry.other[unit] });
    });
  });
  items.sort((a,b)=> a.n.localeCompare(b.n, 'it'));
  return { items, notes, assignedCount };
}

/* Contributo di un singolo ingrediente ai macro, scalato dalla quantita'
   effettivamente inserita rispetto alla quantita' di base del piano. */
function ingContribution(ing, qty){
  const ratio = ing.def ? (qty / ing.def) : 0;
  return { kcal: ing.kcal*ratio, p: ing.p*ratio, c: ing.c*ratio, g: ing.g*ratio };
}
function pastoTotals(pasto, quantities){
  const t = { kcal:0, p:0, c:0, g:0 };
  pasto.ingredienti.forEach((ing,idx)=>{
    const key = pasto.id+'-'+idx;
    /* Finche' non hai spuntato/scritto nulla, un alimento non registrato
       conta 0 — le quantita' del piano sono solo un riferimento, non vengono
       piu' sommate automaticamente come se le avessi gia' mangiate. */
    const qty = (quantities && quantities[key] !== undefined) ? quantities[key] : 0;
    const c = ingContribution(ing, qty);
    t.kcal+=c.kcal; t.p+=c.p; t.c+=c.c; t.g+=c.g;
  });
  return t;
}
function giornoTotals(giorno, quantities){
  const t = { kcal:0, p:0, c:0, g:0 };
  giorno.pasti.forEach(pasto=>{
    const pt = pastoTotals(pasto, quantities);
    t.kcal+=pt.kcal; t.p+=pt.p; t.c+=pt.c; t.g+=pt.g;
  });
  return t;
}
function fmtKcal(n){ return String(Math.round(n)); }
function fmtMacro(n){
  const r = Math.round(n*10)/10;
  if(Math.abs(r - Math.round(r)) < 0.05) return String(Math.round(r));
  return r.toFixed(1).replace('.', ',');
}
/* Totali "di piano" (quantita' consigliate), usati SOLO come riferimento
   nella panoramica e accanto a ogni alimento — non vanno confusi con i
   totali realmente registrati, che partono sempre da 0. */
function giornoBaselineTotals(giorno){
  const t = { kcal:0, p:0, c:0, g:0 };
  giorno.pasti.forEach(pasto=> pasto.ingredienti.forEach(ing=>{
    t.kcal+=ing.kcal; t.p+=ing.p; t.c+=ing.c; t.g+=ing.g;
  }));
  return t;
}
function alimGiornoCardMeta(giorno){
  const t = giornoBaselineTotals(giorno);
  return `Piano: ${fmtKcal(t.kcal)} kcal · P ${fmtMacro(t.p)} · C ${fmtMacro(t.c)} · G ${fmtMacro(t.g)}`;
}
function findIngredientByKey(giorno, key){
  const m = key.match(/^(.+)-(\d+)$/);
  if(!m) return null;
  const pasto = giorno.pasti.find(p=>p.id===m[1]);
  if(!pasto) return null;
  return pasto.ingredienti[parseInt(m[2],10)] || null;
}

function alimCenaName(giorno){
  const cena = giorno.pasti.find(p=>p.id==='cena');

function alimPranzoName(giorno){

/* Confronta nel tempo un macronutriente (o le kcal) effettivamente
   registrati, calcolati dalle registrazioni concluse (giornoTotals sulle
   quantita' salvate). Ricicla lo stesso motore di disegno del grafico
   (cmChartSVG) usato per le misure corporee in Allenamento: i punti hanno
   solo bisogno di un campo "cm" con il valore da plottare, qualunque cosa
   rappresenti davvero. */
let statsAlimSel = { type:'kcal' };
let statsAlimPoints = [];
let statsAlimRange = { from:null, to:null };
async function getAlimMacroHistory(macroType){
  const entries = await listAlimEntries();
  /* Come nel resto della sezione Alimentazione: una registrazione senza il
     campo "finalized" e' una voce storica precedente a quel concetto e va
     considerata conclusa; solo finalized===false e' una bozza aperta, che
     qui escludiamo perche' rappresenterebbe una giornata a meta'. */
  const points = entries
    .filter(e=> e.finalized !== false)
    .map(e=>{
      const giorno = ALIM_GIORNI.find(g=>g.id===e.giornoId);
      if(!giorno) return null;
      const totals = giornoTotals(giorno, e.quantities);
      return { date: e.date, cm: Math.round(totals[macroType]*10)/10 };
    })
    .filter(Boolean);
  points.sort((a,b)=> a.date.localeCompare(b.date));
  return points;
}

  const meta = ALIM_MACRO_META[statsAlimSel.type];
  const body = document.getElementById('alimStatsBody');
  body.innerHTML = `

      <div class="range-field"><label>Da</label><input type="date" id="rangeFromA"></div>

    </div>

      <div class="chart-card-head">
        <div><div class="name">${meta.nome}</div><div class="sub">Target: ${fmtMacro(ALIM_TARGET[statsAlimSel.type])} ${meta.unit}</div></div>
        <span class="stat-pr" id="prBadgeA" style="display:none;"></span>
      </div>
      <div class="chart-svg-wrap" id="chartWrapA"><div class="stat-empty">Caricamento…</div></div>
      <div class="stat-meta-row" id="chartMetaA"></div>
    </div>
  `;
  statsAlimPoints = await getAlimMacroHistory(statsAlimSel.type);
  if(statsAlimPoints.length){
    statsAlimRange.from = statsAlimPoints[0].date;
    statsAlimRange.to = statsAlimPoints[statsAlimPoints.length-1].date;
    document.getElementById('rangeFromA').value = statsAlimRange.from;
    document.getElementById('rangeToA').value = statsAlimRange.to;
  }
  document.getElementById('rangeFromA').onchange = (e)=>{ statsAlimRange.from = e.target.value; document.querySelectorAll('#alimStatsBody .range-chip').forEach(c=>c.classList.remove('active')); updateAlimChartUI(); };
  document.getElementById('rangeToA').onchange = (e)=>{ statsAlimRange.to = e.target.value; document.querySelectorAll('#alimStatsBody .range-chip').forEach(c=>c.classList.remove('active')); updateAlimChartUI(); };
  document.querySelectorAll('#alimStatsBody .range-chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const d = btn.dataset.days;
      setQuickRangeAlim(d === 'all' ? 'all' : parseInt(d));
    });
  });
  updateAlimChartUI();
}
function filteredAlimPoints(){
  return statsAlimPoints.filter(p => (!statsAlimRange.from || p.date >= statsAlimRange.from) && (!statsAlimRange.to || p.date <= statsAlimRange.to));
}
function updateAlimChartUI(){
  const meta = ALIM_MACRO_META[statsAlimSel.type];
  const points = filteredAlimPoints();
  const chartWrap = document.getElementById('chartWrapA');
  const prBadge = document.getElementById('prBadgeA');
  const chartMeta = document.getElementById('chartMetaA');
  if(!chartWrap) return;
  if(points.length === 0){
    chartWrap.innerHTML = `<div class="stat-empty">Nessuna registrazione conclusa in questo intervallo.</div>`;
    chartMeta.innerHTML = ''; prBadge.style.display='none';
    return;
  }
  const last = points[points.length-1];
  prBadge.textContent = `Ultima: ${fmtMacro(last.cm)} ${meta.unit}`;
  prBadge.style.display = 'inline-block';
  if(points.length === 1){
    chartWrap.innerHTML = `<div class="stat-empty">Una sola registrazione nell'intervallo (${fmtDate(last.date)}: ${fmtMacro(last.cm)} ${meta.unit}).</div>`;
    chartMeta.innerHTML = '';
    return;
  }
  chartWrap.innerHTML = cmChartSVG(points);
  const first = points[0];
  chartMeta.innerHTML = `<span>${fmtDate(first.date)}: <b>${fmtMacro(first.cm)} ${meta.unit}</b></span><span>${fmtDate(last.date)}: <b>${fmtMacro(last.cm)} ${meta.unit}</b></span>`;
}
function setQuickRangeAlim(days){
  if(!statsAlimPoints.length) return;
  const lastDate = statsAlimPoints[statsAlimPoints.length-1].date;
  if(days === 'all'){
    statsAlimRange.from = statsAlimPoints[0].date;
    statsAlimRange.to = lastDate;
  } else {
    const d = new Date(lastDate+'T00:00:00');
    d.setDate(d.getDate() - days);
    statsAlimRange.from = d.toISOString().slice(0,10);
    statsAlimRange.to = lastDate;
  }
  document.getElementById('rangeFromA').value = statsAlimRange.from;
  document.getElementById('rangeToA').value = statsAlimRange.to;
  document.querySelectorAll('#alimStatsBody .range-chip').forEach(c=>c.classList.toggle('active', c.dataset.days==String(days)));
  updateAlimChartUI();
}

async function loadAlimHomeSummary(){
  const items = await listAlimEntries();

  ALIM_GIORNI.forEach(gi=>{
    const matching = items.filter(x=>x.giornoId===gi.id);
    matching.sort((a,b)=> b.date.localeCompare(a.date));

    if(!el) return;
    if(!matching.length){ el.textContent = 'Non ancora registrato'; return; }

      ? `<span class="alim-badge">Registrato oggi ✓</span>`
      : `Ultima volta: <b>${fmtDate(last.date)}</b>`;

/* La spunta segna l'alimento come "mangiato" e precompila la quantita' con
   quella consigliata dal piano (comoda quando hai seguito il piano alla
   lettera); il campo numerico resta comunque libero, cosi' se hai mangiato
   una quantita' diversa la correggi a mano — la spunta si aggiorna da sola
   in base al fatto che il campo sia 0 o meno. La quantita' consigliata resta
   sempre visibile come riferimento sotto al nome, dato che il campo NON
   parte piu' precompilato con quel valore. */
function ingRowHTML(pastoId, idx, ing){
  const key = pastoId+'-'+idx;
  return `
    <div class="ing-row" data-key="${key}">
      <button class="ing-check" data-ing-check="${key}" title="Segna come mangiato (quantità consigliata)">${ICO.check}</button>

      </div>

        <span class="ing-unit">${ing.unit}</span>

      <div class="ing-kcal" data-ing-kcal="${key}">0 kcal</div>
    </div>
  `;

function macroSummaryHTML(totals){
  const items = [
    { key:'kcal', label:'Kcal',        val:totals.kcal, target:ALIM_TARGET.kcal, unit:'' },
    { key:'p',    label:'Proteine',    val:totals.p,     target:ALIM_TARGET.p,     unit:'g' },
    { key:'c',    label:'Carboidrati', val:totals.c,     target:ALIM_TARGET.c,     unit:'g' },
    { key:'g',    label:'Grassi',      val:totals.g,     target:ALIM_TARGET.g,     unit:'g' },
  ];
  return items.map(it=>{
    const delta = it.val - it.target;
    const pct = Math.abs(delta) / it.target;
    const color = pct <= 0.08 ? 'var(--success)' : (pct <= 0.18 ? 'var(--teal)' : 'var(--danger)');
    const deltaStr = (delta >= 0 ? '+' : '') + fmtMacro(delta);
    const valStr = it.key === 'kcal' ? fmtKcal(it.val) : fmtMacro(it.val);
    const targetStr = it.key === 'kcal' ? fmtKcal(it.target) : fmtMacro(it.target);
    return `
      <div class="macro-card">
        <div class="mc-val" style="color:${color};">${valStr}${it.unit}</div>
        <div class="mc-lbl">${it.label}</div>
        <div class="mc-target">target ${targetStr}${it.unit} (${deltaStr}${it.unit})</div>
      </div>
    `;
  }).join('');
}
function recomputeAlimTotals(giorno){
  giorno.pasti.forEach(pasto=>{
    pasto.ingredienti.forEach((ing,idx)=>{
      const key = pasto.id+'-'+idx;
      const qty = (state.alimQuantities[key] !== undefined) ? state.alimQuantities[key] : 0;
      const c = ingContribution(ing, qty);
      const kcalEl = app.querySelector(`[data-ing-kcal="${key}"]`);
      if(kcalEl) kcalEl.textContent = `${fmtKcal(c.kcal)} kcal`;
    });
    const pt = pastoTotals(pasto, state.alimQuantities);
    const ptKcalEl = app.querySelector(`[data-pt-kcal="${pasto.id}"]`);
    const ptMacroEl = app.querySelector(`[data-pt-macro="${pasto.id}"]`);
    if(ptKcalEl) ptKcalEl.textContent = `${fmtKcal(pt.kcal)} kcal`;
    if(ptMacroEl) ptMacroEl.textContent = `· P ${fmtMacro(pt.p)} · C ${fmtMacro(pt.c)} · G ${fmtMacro(pt.g)}`;
  });
  const totals = giornoTotals(giorno, state.alimQuantities);
  const summaryEl = document.getElementById('macroSummary');
  if(summaryEl) summaryEl.innerHTML = macroSummaryHTML(totals);
}
let alimSaveTimeout = null;
function flashAlimSavePill(){

  flashAlimSavePill._t = setTimeout(()=> pill.classList.remove('show'), 1200);
}
function queueAlimSave(giorno){
  clearTimeout(alimSaveTimeout);
  alimSaveTimeout = setTimeout(async ()=>{
    try{
      await saveAlimEntry(state.alimDate, giorno.id, state.alimQuantities);
      flashAlimSavePill();
    }catch(e){ showToast('Errore salvataggio'); }

}
function setAlimQty(giorno, key, qty){
  state.alimQuantities[key] = qty;
  const input = app.querySelector(`[data-ing-qty="${key}"]`);
  if(input) input.value = qty;
  const checkBtn = app.querySelector(`[data-ing-check="${key}"]`);
  if(checkBtn) checkBtn.classList.toggle('on', qty > 0);
}
function wireAlimInputs(giorno){
  app.querySelectorAll('[data-ing-qty]').forEach(input=>{
    input.addEventListener('input', ()=>{
      const key = input.dataset.ingQty;
      const v = parseFloat(input.value);
      const qty = isNaN(v) ? 0 : v;
      state.alimQuantities[key] = qty;
      const checkBtn = app.querySelector(`[data-ing-check="${key}"]`);
      if(checkBtn) checkBtn.classList.toggle('on', qty > 0);
      recomputeAlimTotals(giorno);
      queueAlimSave(giorno);
    });
  });
  app.querySelectorAll('[data-ing-check]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.ingCheck;
      const isOn = btn.classList.contains('on');
      if(isOn){
        setAlimQty(giorno, key, 0);
      } else {
        const ing = findIngredientByKey(giorno, key);
        setAlimQty(giorno, key, ing ? ing.def : 0);
      }
      recomputeAlimTotals(giorno);
      queueAlimSave(giorno);
    });
  });
}
async function loadExistingAlimEntry(giorno, forDate){
  const entry = await loadAlimEntry(forDate);
  if(state.alimDate !== forDate) return; // l'utente ha gia' cambiato data: non sovrascrivere
  if(entry && entry.giornoId === giorno.id && entry.quantities){
    state.alimQuantities = { ...entry.quantities };
    Object.keys(state.alimQuantities).forEach(key=> setAlimQty(giorno, key, state.alimQuantities[key]));
    recomputeAlimTotals(giorno);
  }
}

async function refreshAlimStorico(){
  const body = document.getElementById('alimStoricoBody');
  if(!body) return;
  const entries = await listAlimEntries();
  if(!entries.length){
    body.innerHTML = `<div class="cron-empty">Nessuna registrazione salvata finora.<br>Registrane una dalle varianti del piano.</div>`;
    return;
  }
  const groups = {};
  entries.forEach(e=>{
    const ym = e.date.slice(0,7);
    if(!groups[ym]) groups[ym] = [];
    groups[ym].push(e);
  });
  const monthKeys = Object.keys(groups).sort().reverse();
  body.innerHTML = monthKeys.map(ym=>{
    const [y,m] = ym.split('-');
    const mi = parseInt(m)-1;
    const label = (MESI_IT[mi] && y) ? `${MESI_IT[mi]} ${y}` : 'Data sconosciuta';
    const rowsSorted = groups[ym].slice().sort((a,b)=> b.date.localeCompare(a.date));
    const rows = rowsSorted.map(e=>{
      const giorno = ALIM_GIORNI.find(g=>g.id===e.giornoId);
      const totals = giorno ? giornoTotals(giorno, e.quantities) : { kcal:0, p:0, c:0, g:0 };
      const d = new Date(e.date+'T00:00:00');
      return `
        <div class="swipe-wrap" data-date="${e.date}">
          <div class="swipe-action-bg">${ICO.trash}<span>Elimina</span></div>
          <div class="swipe-surface">
            <div class="session-row" data-date="${e.date}">
              <div class="sr-left">
                <div class="sr-date">${d.getDate()}</div>
                <div class="sr-info">
                  <div class="sr-giorno">${giorno ? 'Variante '+giorno.lettera : 'Variante sconosciuta'} · ${fmtKcal(totals.kcal)} kcal</div>
                  <div class="sr-meta">${fmtDate(e.date)} · P ${fmtMacro(totals.p)} · C ${fmtMacro(totals.c)} · G ${fmtMacro(totals.g)}</div>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:6px;">
                <button class="sr-edit" data-date="${e.date}">${ICO.edit}</button>
                <button class="sr-del" data-date="${e.date}">${ICO.trash}</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');
    return `<div class="month-group"><div class="month-title">${label}</div>${rows}</div>`;
  }).join('');
  body.querySelectorAll('.session-row').forEach(row=>{
    row.addEventListener('click', ()=> openAlimEntryForEdit(row.dataset.date));
  });
  body.querySelectorAll('.sr-edit').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); openAlimEntryForEdit(btn.dataset.date); });
  });
  const doDelete = (date)=>{
    showConfirm(`Eliminare la registrazione del ${fmtDate(date)}? L'operazione non può essere annullata.`, async ()=>{
      try{
        await deleteAlimEntry(date);
        showToast('Registrazione eliminata');
        await refreshAlimStorico();
      }catch(e){ showToast('Errore — impossibile eliminare, riprova'); }
    });
  };
  body.querySelectorAll('.sr-del').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); doDelete(btn.dataset.date); });
  });
  body.querySelectorAll('.swipe-wrap').forEach(sw=>{
    enableSwipe(sw, ()=> doDelete(sw.dataset.date));
  });
}
async function openAlimEntryForEdit(date){
  const entry = await loadAlimEntry(date);
  if(!entry){ showToast('Registrazione non trovata'); return; }
  renderGiornoAlimentare(entry.giornoId, date);
}

async function startNewWorkout(giornoId){
  const giorno = giornoById(giornoId);
  /* Se per questo giorno esiste gia' una sessione salvata OGGI, non la riapriamo
     più in automatico: chiediamo prima conferma, poi se sovrascrivere quella
     sessione o crearne una seconda separata per la stessa giornata. */
  const today = todayLocalISO();
  let todaySession = null;
  try{
    const sessions = await listSessionsDetailed(giornoId);
    todaySession = sessions.find(s=>s.date===today) || null;
  }catch(e){}
  if(todaySession){
    showConfirm(
      'Hai già registrato un allenamento di questo tipo oggi. Sei sicura di voler ricominciare lo stesso allenamento nello stesso giorno?',
      ()=>{
        showConfirm(
          'Vuoi sovrascrivere l\'allenamento già fatto oggi, oppure crearne uno nuovo separato?',
          async ()=>{
            try{
              await deleteSession(giornoId, todaySession.sessionId);
              beginBlankWorkout(giornoId, giorno);
            }catch(e){ showToast('Errore — riprova'); }
          },
          'Sovrascrivi',
          'Duplica',
          ()=> beginBlankWorkout(giornoId, giorno)
        );
      },
      'Sì',
      'No'
    );
    return;
  }
  beginBlankWorkout(giornoId, giorno);
}
function beginBlankWorkout(giornoId, giorno){
  state.giornoId = giornoId;
  state.cicloId = giorno.cicloId;
  state.sessionId = generateSessionId();
  state.returnTo = 'cicli';
  state.log = blankLog(giorno);
  state.screen = 'workout';
  renderWorkout();
}
async function openExistingSession(giornoId, sessionId, returnTo){
  state.giornoId = giornoId;
  state.sessionId = sessionId;
  state.returnTo = returnTo || 'cronologia';
  try{
    const res = await window.storage.get(logKey(giornoId, sessionId), false);

  }
  state.screen = 'workout';
  renderWorkout();
}

/* ============== REST TIMER ==============
   Chiudere la finestra del timer (X) NON lo ferma: il conto alla rovescia
   prosegue in background e la barra in fondo si trasforma in una versione
   ridotta (anellino + tempo + play/pausa + -10/+10) così puoi continuare a

function wireTimer(){

/* true se un timer e' in corso o e' stato messo in pausa a meta' (quindi va
   mostrata la versione ridotta invece della semplice scelta del tempo) */
function timerIsActive(){

    bar.innerHTML = `

      <button class="chip ${timer.total===90?'active':''}" data-t="90">90″</button>

    bar.querySelectorAll('.chip').forEach(chip=>{

    document.getElementById('timerStart').onclick = ()=>openTimerSheet();
