<style>
:root{
  color-scheme: light;
  --bg:#101314;
  --bg-elev:#181c1e;
  --bg-card:#1e2325;
  --bg-card-hover:#242a2c;
  --border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.16);
  --text:#f2efe9;
  --text-muted:#8b9296;
  --text-faint:#5c6366;
  --accent:#ff5c39;
  --accent-dim:rgba(255,92,57,0.14);
  --teal:#3fc7b8;
  --teal-dim:rgba(63,199,184,0.14);
  --success:#7ed957;
  --success-dim:rgba(126,217,87,0.14);
  --danger:#ff6b6b;
  --danger-dim:rgba(255,107,107,0.14);
  --radius:14px;
  --disp:'Bebas Neue', sans-serif;
  --mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{color-scheme: light;}
body{
  margin:0;
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,92,57,0.08), transparent),
    var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  padding-bottom:24px;
}
body.has-timerbar{padding-bottom:110px;}
::selection{background:var(--accent);color:#101314;}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;}
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(16,19,20,0.88);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:14px 18px;
  display:flex;align-items:center;gap:12px;
}
.topbar .back{
  width:34px;height:34px;border-radius:50%;
  border:1px solid var(--border-strong);background:var(--bg-card);
  display:flex;align-items:center;justify-content:center;
  color:var(--text);flex-shrink:0;
}

.wrap{max-width:640px;margin:0 auto;padding:20px 18px 0;}
.hero{padding:34px 18px 10px;text-align:left;max-width:640px;margin:0 auto;}

.section-label{

/* HOME */

}
.home-card .hc-ico svg{width:22px;height:22px;}
.home-card .hc-info{flex:1;min-width:0;}
.home-card .hc-title{font-weight:700;font-size:16px;margin-bottom:2px;}

.home-card .hc-arrow{color:var(--text-faint);flex-shrink:0;}
.home-card .hc-arrow svg{width:18px;height:18px;}
/* GIORNO GRID */
.giorno-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:10px;}

.giorno-card{

  padding:18px;text-align:left;color:var(--text);position:relative;overflow:hidden;
}
.giorno-card:active{transform:scale(0.98);}
.giorno-card .gnum{font-family:var(--disp);font-size:15px;color:var(--accent);letter-spacing:.08em;}
.giorno-card .glabel{font-weight:700;font-size:16px;margin:4px 0 2px;}
.giorno-card .gsub{font-size:11.5px;color:var(--text-muted);margin-bottom:8px;}
.giorno-card .gmeta{font-size:11px;color:var(--text-faint);font-family:var(--mono);}
.giorno-card .glast{

  font-size:11px;color:var(--text-faint);font-family:var(--mono);
}

.date-bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;

  padding:12px 16px;margin-bottom:18px;
}
.date-bar label{font-size:11px;color:var(--text-muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:3px;}
.date-bar input[type=date]{
  background:transparent;border:none;color:var(--text);font-size:15px;font-weight:600;
  font-family:var(--mono);
}
.date-bar input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.8);}
.save-pill{
  font-family:var(--mono);font-size:11px;padding:6px 12px;border-radius:20px;

}

.warmup-note{
  display:flex;align-items:center;gap:10px;background:var(--teal-dim);border:1px solid rgba(63,199,184,0.25);

}
.warmup-note svg{width:16px;height:16px;flex-shrink:0;}
.info-panel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px;overflow:hidden;}
.info-panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px;cursor:pointer;gap:10px;}
.info-panel-head .iph-title{font-weight:700;font-size:14px;}
.info-panel-head .iph-sub{font-size:12px;color:var(--text-muted);margin-top:3px;}
.info-panel-chev{color:var(--text-faint);transition:transform .2s;flex-shrink:0;}
.info-panel-chev svg{width:16px;height:16px;}
.info-panel-chev.open{transform:rotate(180deg);}
.info-panel-body{max-height:0;overflow:hidden;transition:max-height .35s ease;padding:0 16px;}
.info-panel-body.open{max-height:2400px;padding:0 16px 18px;}
.info-panel-body p{font-size:13px;line-height:1.65;color:var(--text-muted);margin:0 0 13px;}

.info-panel-body ul{margin:0 0 13px;padding-left:18px;}
.info-panel-body ul li{font-size:13px;line-height:1.6;color:var(--text-muted);margin-bottom:6px;}
.info-panel-body ul li:last-child{margin-bottom:0;}
.ex-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);

}
.ex-head{padding:14px 16px 12px;border-bottom:1px solid var(--border);}
.ex-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.ex-name-btn{

}
.ex-name-btn .ex-name{

}
.ex-name-btn .info-ico{color:var(--accent);flex-shrink:0;}
.ex-name-btn .info-ico svg{width:14px;height:14px;}
.ex-name-plain{font-weight:700;font-size:14.5px;line-height:1.3;color:var(--text-muted);}
.ex-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.ex-badge{

}
.ex-badge.rpe{color:var(--teal);background:var(--teal-dim);}
.ex-badge.removed{color:var(--text-faint);background:var(--bg-elev);}
.ex-note{font-size:11.5px;color:var(--text-faint);margin-top:5px;font-style:italic;}
.rec-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 16px;background:var(--bg-elev);font-size:12px;color:var(--text-muted);
}
.rec-row .rlabel{font-family:var(--mono);}
.rec-row .rlabel b{color:var(--text);}
.rec-start{

}

.set-table{padding:6px 16px 12px;}
.set-row{

}

}

}

}
.set-row .set-done.on{background:var(--success);border-color:var(--success);}
.set-row .set-done svg{width:15px;height:15px;color:#101314;opacity:0;}
.set-row .set-done.on svg{opacity:1;}
.col-labels{
  display:grid;grid-template-columns:26px 1fr 1fr 34px;gap:8px;
  font-family:var(--mono);font-size:9.5px;color:var(--text-faint);text-transform:uppercase;
  letter-spacing:.06em;padding:8px 0 4px;
}
.ex-actions{display:flex;gap:8px;padding:0 16px 14px;}
.set-btn{
  flex:1;border:1px dashed var(--border-strong);background:transparent;color:var(--text-muted);

}

.cta{

  border-radius:12px;padding:16px;font-weight:800;text-align:center;

}
.cta:active{opacity:.85;}
.toast{
  position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-60px);
  background:var(--success);color:#0e1210;font-family:var(--mono);font-size:12.5px;font-weight:700;
  padding:10px 18px;border-radius:20px;z-index:200;transition:transform .3s ease;
}
.toast.show{transform:translateX(-50%) translateY(0);}
.hidden{display:none !important;}
/* STATS */
.stat-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;}
.stat-summary-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;text-align:left;
}
.stat-summary-card .val{font-family:var(--disp);font-size:32px;color:var(--accent);line-height:1;}
.stat-summary-card .lbl{font-size:11px;color:var(--text-muted);margin-top:4px;font-family:var(--mono);}
.stat-empty{font-size:12px;color:var(--text-faint);font-family:var(--mono);padding:6px 0;}
.stat-meta-row{
  display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);
  font-family:var(--mono);margin-top:6px;
}
.stat-meta-row b{color:var(--text);}
.picker-btn{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--bg-card);border:1px solid var(--border-strong);border-radius:var(--radius);
  padding:15px 16px;color:var(--text);margin-bottom:16px;
}
.picker-btn .pb-left{text-align:left;min-width:0;}
.picker-btn .pb-eyebrow{font-family:var(--mono);font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px;}
.picker-btn .pb-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.picker-btn .pb-chev{color:var(--text-faint);flex-shrink:0;}
.picker-btn .pb-chev svg{width:16px;height:16px;}
.picker-sheet{
  position:fixed;inset:0;z-index:110;background:rgba(8,10,10,0.75);
  display:none;align-items:flex-end;justify-content:center;
}
.picker-sheet.open{display:flex;}
.picker-sheet-inner{
  width:100%;max-width:640px;max-height:78vh;background:var(--bg-elev);
  border-radius:24px 24px 0 0;border:1px solid var(--border-strong);border-bottom:none;
  display:flex;flex-direction:column;animation:slideup .25s ease;
}
@keyframes slideup{from{transform:translateY(100%);}to{transform:translateY(0);}}
.picker-head{
  display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.picker-head h3{margin:0;font-family:var(--disp);font-size:20px;letter-spacing:.02em;}
.picker-head button{background:none;border:none;color:var(--text-faint);}
.picker-head button svg{width:20px;height:20px;}
.picker-scroll{overflow-y:auto;padding:8px 8px 20px;}
.picker-group{margin-top:10px;}
.picker-group-label{
  font-family:var(--mono);font-size:10.5px;color:var(--text-faint);text-transform:uppercase;
  letter-spacing:.1em;padding:8px 12px 6px;
}
.picker-ciclo-label{
  font-family:var(--disp);font-size:16px;letter-spacing:.02em;color:var(--accent);
  padding:14px 12px 2px;
}
.picker-item{
  width:100%;text-align:left;background:none;border:none;color:var(--text-muted);
  padding:12px;border-radius:10px;font-size:14px;display:flex;align-items:center;justify-content:space-between;
}
.picker-item:active{background:var(--bg-card);}
.picker-item.sel{color:var(--accent);background:var(--accent-dim);font-weight:700;}
.picker-item svg{width:15px;height:15px;}
.chart-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 16px 8px;margin-bottom:16px;
}
.chart-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;}
.chart-card-head .name{font-weight:700;font-size:15.5px;}
.chart-card-head .sub{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
.chart-svg-wrap{width:100%;}
.chart-svg-wrap svg{width:100%;height:auto;display:block;}
.chart-axis-line{stroke:var(--border-strong);stroke-width:1;}

.chart-tick-label{font-family:var(--mono);fill:var(--text-faint);font-size:9px;}
.chart-point-label{font-family:var(--mono);fill:var(--text-muted);font-size:9px;}
.range-row{display:flex;gap:10px;margin-bottom:10px;}

}

.month-group{margin-bottom:22px;}

}

.session-row .sr-info{min-width:0;}
.session-row .sr-giorno{font-weight:700;font-size:13.5px;}
.session-row .sr-meta{font-size:11px;color:var(--text-muted);font-family:var(--mono);}
.session-row .sr-del{

}
.session-row .sr-del svg{width:15px;height:15px;}
.cron-empty{text-align:center;padding:60px 20px;color:var(--text-faint);font-size:13.5px;}
/* INFO SHEET (technique popup) */
.info-sheet{
  position:fixed;inset:0;z-index:120;background:rgba(8,10,10,0.75);
  display:none;align-items:flex-end;justify-content:center;
}
.info-sheet.open{display:flex;}
.info-sheet-inner{
  width:100%;max-width:640px;max-height:85vh;background:var(--bg-elev);
  border-radius:24px 24px 0 0;border:1px solid var(--border-strong);border-bottom:none;
  display:flex;flex-direction:column;animation:slideup .25s ease;
}
.info-head{
  display:flex;align-items:flex-start;justify-content:space-between;padding:20px 20px 14px;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.info-head h3{margin:0;font-family:var(--disp);font-size:24px;letter-spacing:.02em;line-height:1;}

.info-head button svg{width:20px;height:20px;}
.info-scroll{overflow-y:auto;padding:16px 20px 28px;}
.info-block{margin-bottom:18px;}
.info-block:last-child{margin-bottom:0;}
.info-block-label{
  display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--accent);
  text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:6px;
}
.info-block-label svg{width:14px;height:14px;}
.info-block p{margin:0;font-size:13.5px;line-height:1.6;color:var(--text-muted);}
/* CONFIRM MODAL */
.confirm-overlay{
  position:fixed;inset:0;z-index:200;background:rgba(8,10,10,0.8);
  display:none;align-items:center;justify-content:center;padding:24px;
}
.confirm-overlay.open{display:flex;}
.confirm-box{
  background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:16px;

}
.confirm-box p{font-size:14px;color:var(--text);margin:0 0 18px;line-height:1.5;}
.confirm-actions{display:flex;gap:10px;}
.confirm-actions button{

}
.confirm-cancel{background:var(--bg-card);color:var(--text-muted);border:1px solid var(--border-strong) !important;}
.confirm-ok{background:var(--danger);color:#1a0a0a;}

.timer-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(24,28,30,0.95);backdrop-filter:blur(14px);
  border-top:1px solid var(--border-strong);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
}
.timer-bar-inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;}
.timer-label{
  font-family:var(--mono);font-size:10px;color:var(--text-faint);text-transform:uppercase;
  letter-spacing:.1em;margin-right:2px;
}
.chip{
  font-family:var(--mono);font-size:12.5px;padding:9px 12px;border-radius:20px;
  border:1px solid var(--border-strong);background:var(--bg-elev);color:var(--text-muted);

.timer-start{
  margin-left:auto;flex-shrink:0;width:44px;height:44px;border-radius:50%;

  color:#101314;
}
.timer-start svg{width:18px;height:18px;}
.timer-sheet{
  position:fixed;inset:0;z-index:130;background:rgba(8,10,10,0.7);
  display:none;align-items:flex-end;justify-content:center;
}
.timer-sheet.open{display:flex;}
.timer-sheet-inner{
  width:100%;max-width:640px;background:var(--bg-elev);

.timer-source{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-bottom:4px;text-align:center;}
.ring-wrap{position:relative;width:230px;height:230px;margin:6px 0 20px;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--border);stroke-width:12;}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;transition:stroke .3s;}
.ring-fg.done{stroke:var(--success);}
.ring-center{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.ring-time{font-family:var(--mono);font-size:44px;font-weight:700;letter-spacing:-0.02em;}
.ring-status{font-family:var(--mono);font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;margin-top:4px;}
.timer-controls{display:flex;align-items:center;gap:14px;}
.tc-btn{
  width:52px;height:52px;border-radius:50%;border:1px solid var(--border-strong);
  background:var(--bg-card);color:var(--text);display:flex;align-items:center;justify-content:center;
}
.tc-btn svg{width:18px;height:18px;}
.tc-main{
  width:64px;height:64px;background:var(--accent);border:none;color:#101314;
}
.tc-main svg{width:24px;height:24px;}
/* AUTH */
.auth-wrap{max-width:420px;margin:0 auto;padding:60px 20px 40px;}
.auth-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;font-weight:700;margin-bottom:8px;}
.auth-wrap h1{font-family:var(--disp);font-size:40px;line-height:0.95;margin:0 0 8px;}
.auth-wrap .auth-sub{color:var(--text-muted);font-size:14px;line-height:1.5;margin:0 0 24px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;color:var(--text-muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.field input{
  width:100%;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:10px;
  padding:13px 14px;color:var(--text);font-size:15px;
}
.field input:focus{outline:none;border-color:var(--accent);}
.auth-error{background:var(--danger-dim);color:var(--danger);border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;display:none;}
.auth-error.show{display:block;}
.auth-info{background:var(--teal-dim);color:var(--teal);border-radius:10px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;display:none;}
.auth-info.show{display:block;}
.auth-switch{text-align:center;margin-top:18px;font-size:13px;color:var(--text-muted);}
.auth-switch a{color:var(--accent);font-weight:700;text-decoration:none;cursor:pointer;}
.auth-forgot{text-align:right;margin:-6px 0 18px;}
.auth-forgot a{color:var(--text-muted);font-size:12.5px;text-decoration:none;cursor:pointer;}
.logout-link{
  position:fixed;top:16px;right:16px;z-index:45;
  font-family:var(--mono);font-size:11px;color:var(--text-faint);background:var(--bg-card);
  border:1px solid var(--border-strong);border-radius:20px;padding:7px 12px;text-decoration:none;
}
/* MISURE */
.measure-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.measure-field{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:12px;}
.measure-field label{display:block;font-size:11px;color:var(--text-muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.measure-field .mf-row{display:flex;align-items:center;gap:6px;}
.measure-field input{
  width:100%;background:var(--bg-elev);border:1px solid var(--border);border-radius:8px;
  padding:9px 8px;color:var(--text);font-family:var(--mono);font-size:15px;text-align:center;
}
.measure-field .mf-unit{font-family:var(--mono);font-size:11px;color:var(--text-faint);flex-shrink:0;}
.measure-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--bg-card);border:1px solid var(--border);border-radius:12px;
  padding:13px 14px;margin-bottom:8px;
}
.measure-row .mr-date{font-weight:700;font-size:13.5px;}
.measure-row .mr-vals{font-size:11.5px;color:var(--text-muted);font-family:var(--mono);margin-top:2px;}
/* TABS */
.tab-row{display:flex;gap:8px;margin-bottom:20px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:4px;}
.tab-btn{flex:1;background:none;border:none;color:var(--text-muted);font-family:var(--mono);font-size:12.5px;font-weight:700;padding:10px;border-radius:9px;text-transform:uppercase;letter-spacing:.04em;}
.tab-btn.active{background:var(--accent);color:#101314;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast">Salvato</div>
<div class="info-sheet" id="infoSheet">
  <div class="info-sheet-inner">
    <div class="info-head">
      <h3 id="infoTitle">Esercizio</h3>
      <button id="infoClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="info-scroll" id="infoScroll"></div>
  </div>
</div>
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p id="confirmMsg">Sei sicura?</p>
    <div class="confirm-actions">
      <button class="confirm-cancel" id="confirmCancel">Annulla</button>
      <button class="confirm-ok" id="confirmOk">Elimina</button>
    </div>
  </div>
</div>

/* ============== STORAGE ADAPTER (Firestore, per utente) ==============
   Ogni utente autenticato ha una collezione privata users/{uid}/kv. L'adapter
   espone la stessa identica forma (set/get/delete/list) di prima: tutta la
   logica dell'app sotto resta invariata. I dati vivono nel cloud legati
   all'account, quindi non si perdono cambiando telefono, browser o
   cancellando la cronologia di Safari. */
window.storage = {
  _col(){
    if(!currentUser) throw new Error('Utente non autenticato');
    return db.collection('users').doc(currentUser.uid).collection('kv');
  },
  async set(key, value, _unused){
    try{ await this._col().doc(key).set({ value }); return true; }catch(e){ return false; }
  },
  async get(key, _unused){
    try{
      const snap = await this._col().doc(key).get();
      return snap.exists ? { value: snap.data().value } : null;
    }catch(e){ return null; }
  },
  async delete(key, _unused){
    try{ await this._col().doc(key).delete(); return true; }catch(e){ return false; }
  },
  async list(prefix, _unused){
    try{
      const end = prefix + '';
      const q = await this._col()
        .where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
        .where(firebase.firestore.FieldPath.documentId(), '<', end)
        .get();
      return { keys: q.docs.map(d=>d.id) };
    }catch(e){ return { keys: [] }; }
  }
};

/* ============== STORAGE HELPERS ==============
   Chiave di salvataggio basata sull'id stabile del giorno (mai sulla posizione). */
function logKey(giornoId,sessionId){ return `log-v2-${giornoId}-${sessionId}`; }
function generateSessionId(){ return 's'+Date.now()+'_'+Math.random().toString(36).slice(2,8); }
function sessionTimeLabel(sessionId){
  if(!sessionId || !sessionId.startsWith('s')) return '';
  try{
    const ts = parseInt(sessionId.split('_')[0].slice(1));
    if(isNaN(ts)) return '';
    const label = new Date(ts).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
    return label === 'Invalid Date' ? '' : label;
  }catch(e){ return ''; }
}
/* Costruisce una sessione vuota per un giorno, facendo uno "snapshot" di nome e
   schema serie di ogni esercizio così com'è ORA — anche se in futuro la scheda
   cambia (o passa a un nuovo ciclo), questa sessione ricorderà per sempre cos'era
   stato effettivamente svolto. */
function blankLog(giorno){
  const log = { date:new Date().toISOString().slice(0,10), giornoId:giorno.id, giornoLabel:giorno.label, giornoMeta:giorno.meta, cicloId:giorno.cicloId, esercizi:{} };
  giorno.esercizi.forEach(ex=>{
    log.esercizi[ex.id] = { name:ex.n, sc:ex.sc, sets: Array.from({length:ex.s},()=>({kg:'',reps:'',done:false})) };
  });
  return log;
}
async function saveLog(){
  if(!state.log) return;
  try{
    await window.storage.set(logKey(state.giornoId,state.sessionId), JSON.stringify(state.log), false);
    showToast('Sessione salvata ✓');
  }catch(e){ showToast('Errore salvataggio'); }
}
function queueSave(){ clearTimeout(saveTimeout); saveTimeout = setTimeout(saveLog, 700); }

async function listSessionsDetailed(giornoId){
  try{
    const prefix = `log-v2-${giornoId}-`;
    const res = await window.storage.list(prefix, false);
    if(!res || !res.keys) return [];
    const items = [];
    for(const k of res.keys){
      const sessionId = k.slice(prefix.length);
      try{
        const r = await window.storage.get(k, false);
        if(r && r.value){
          const log = JSON.parse(r.value);
          const date = log.date || new Date().toISOString().slice(0,10);
          items.push({ sessionId, date, log });
        }
      }catch(e){}
    }
    items.sort((a,b)=> b.date.localeCompare(a.date) || b.sessionId.localeCompare(a.sessionId));
    return items;
  }catch(e){ return []; }
}

function measureKey(id){ return `misure-${id}`; }
async function saveMeasureEntry(date, values){
  const id = 'm'+Date.now();
  await window.storage.set(measureKey(id), JSON.stringify({ date, values }), false);
  return id;
}
async function listMeasureEntries(){
  try{
    const res = await window.storage.list('misure-', false);
    if(!res || !res.keys) return [];
    const items = [];
    for(const k of res.keys){
      const r = await window.storage.get(k, false);
      if(r && r.value){
        try{ items.push({ key:k, ...JSON.parse(r.value) }); }catch(e){}
      }
    }
    items.sort((a,b)=> b.date.localeCompare(a.date) || b.key.localeCompare(a.key));
    return items;
  }catch(e){ return []; }
}
async function deleteMeasureEntry(key){
  try{ await window.storage.delete(key, false); return true; }catch(e){ return false; }
}
async function getMeasureTypeHistory(type){
  const entries = await listMeasureEntries();
  const points = [];
  entries.forEach(e=>{
    const v = e.values && e.values[type];
    const cm = parseFloat(v);
    if(v !== undefined && v !== '' && !isNaN(cm)) points.push({ date:e.date, cm, key:e.key });
  });
  points.sort((a,b)=> a.date.localeCompare(b.date));
  return points;
}

function wireTimer(){

  chips.forEach(chip=>{
    chip.addEventListener('click', ()=>{
      chips.forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');

      if(!timer.running) timer.remaining = timer.total;

  });

  document.getElementById('timerClose').onclick = ()=>document.getElementById('timerSheet').classList.remove('open');

function startTimerWithDuration(seconds, name){

function openTimerSheet(forceStart){
  document.getElementById('timerSheet').classList.add('open');

function startTimer(){
  timer.running = true;
  document.getElementById('tcToggle').innerHTML = ICO.pause;
  document.getElementById('timerStart').innerHTML = ICO.pause;
  document.getElementById('ringStatus').textContent = 'recupero';
  clearInterval(timer.intervalId);
  timer.intervalId = setInterval(()=>{
    timer.remaining -= 1;
    if(timer.remaining <= 0){ timer.remaining = 0; finishTimer(); }
    updateRing();
  },1000);
  updateRing();
}
function pauseTimer(){
  timer.running = false; clearInterval(timer.intervalId);
  document.getElementById('tcToggle').innerHTML = ICO.play;
  document.getElementById('timerStart').innerHTML = ICO.play;
  document.getElementById('ringStatus').textContent = 'in pausa';
}
function toggleTimer(){ timer.running ? pauseTimer() : startTimer(); }
function resetTimer(){
  pauseTimer(); timer.remaining = timer.total;
  document.getElementById('ringStatus').textContent = 'recupero';
  document.getElementById('ringFg').classList.remove('done');
  updateRing();
}
function adjustTimer(delta){
  timer.remaining = Math.max(0, timer.remaining + delta);
  timer.total = Math.max(timer.total, timer.remaining);
  updateRing();
}
function finishTimer(){
  pauseTimer();
  document.getElementById('ringStatus').textContent = 'tempo scaduto!';
  document.getElementById('ringFg').classList.add('done');
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,0.18,0.36].forEach(t=>{
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; g.gain.value = 0.15;
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.12);
    });
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
}
function updateRing(){
  const ring = document.getElementById('ringFg');

  if(!ring || !timeEl) return;
  const circumference = 628;
  const pct = timer.total>0 ? timer.remaining/timer.total : 0;
  ring.setAttribute('stroke-dashoffset', circumference*(1-pct));
  const m = Math.floor(timer.remaining/60).toString().padStart(2,'0');
  const s = (timer.remaining%60).toString().padStart(2,'0');
  timeEl.textContent = `${m}:${s}`;
}

   ciclo (attuale o precedente), così le loro statistiche restano comunque

async function discoverOrphanExercises(){

    sessions.forEach(s=>{

        }

async function getExerciseHistory(exId){
  const points = [];
  for(const g of allGiorni()){
    const sessions = await listSessionsDetailed(g.id);
    sessions.forEach(s=>{
      const entry = s.log.esercizi && s.log.esercizi[exId];
      if(!entry) return;
      let best = null;
      (entry.sets||[]).forEach(r=>{
        const kg = parseFloat(r.kg);
        if(!isNaN(kg) && (best === null || kg > best.kg)) best = {kg, reps:r.reps};
      });
      if(best) points.push({date:s.date, kg:best.kg, reps:best.reps, sessionId:s.sessionId});
    });
  }
  points.sort((a,b)=> a.date.localeCompare(b.date));
  return points;
}
function niceStep(range){
  const raw = range/4;
  const pow = Math.pow(10, Math.floor(Math.log10(raw||1)));
  const norm = raw/pow;
  let step;
  if(norm < 1.5) step = 1; else if(norm < 3) step = 2; else if(norm < 7) step = 5; else step = 10;
  return step*pow;
}
function lineChartSVG(points){
  const W = 340, H = 240;
  const mL = 34, mR = 12, mT = 16, mB = 34;
  const plotW = W - mL - mR, plotH = H - mT - mB;
  const kgs = points.map(p=>p.kg);
  let yMin = Math.min(...kgs), yMax = Math.max(...kgs);
  if(yMin === yMax){ yMin -= 5; yMax += 5; }
  const step = niceStep(yMax - yMin) || 1;
  yMin = Math.floor(yMin/step)*step; yMax = Math.ceil(yMax/step)*step;
  if(yMin === yMax) yMax = yMin + step;
  const ticks = [];
  for(let v = yMin; v <= yMax + 0.001; v += step) ticks.push(Math.round(v*100)/100);
  const xFor = (i)=> points.length === 1 ? mL + plotW/2 : mL + (i/(points.length-1))*plotW;
  const yFor = (kg)=> mT + (1 - (kg-yMin)/(yMax-yMin)) * plotH;
  const gridLines = ticks.map(t=>{
    const y = yFor(t);
    return `<line class="chart-grid-line" x1="${mL}" y1="${y.toFixed(1)}" x2="${W-mR}" y2="${y.toFixed(1)}"/>
      <text class="chart-tick-label" x="${mL-6}" y="${(y+3).toFixed(1)}" text-anchor="end">${t}</text>`;
  }).join('');
  const showEveryLabel = points.length <= 7;
  const xLabels = points.map((p,i)=>{
    if(!showEveryLabel && i % Math.ceil(points.length/6) !== 0 && i !== points.length-1) return '';
    const x = xFor(i);
    return `<text class="chart-tick-label" x="${x.toFixed(1)}" y="${H-mB+16}" text-anchor="middle">${fmtDayMonth(p.date)}</text>`;
  }).join('');
  const coords = points.map((p,i)=>[xFor(i), yFor(p.kg)]);
  const path = coords.map((c,i)=> (i===0?'M':'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const dots = coords.map((c,i)=>`
      <circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="${i===coords.length-1?5:3.5}" style="fill:${i===coords.length-1?'var(--accent)':'var(--bg-elev)'};stroke:var(--accent);stroke-width:2;"/>
      ${points.length<=9?`<text class="chart-point-label" x="${c[0].toFixed(1)}" y="${(c[1]-10).toFixed(1)}" text-anchor="middle">${points[i].kg}</text>`:''}
  `).join('');
  return `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      ${gridLines}
      <line class="chart-axis-line" x1="${mL}" y1="${mT}" x2="${mL}" y2="${H-mB}"/>
      <line class="chart-axis-line" x1="${mL}" y1="${H-mB}" x2="${W-mR}" y2="${H-mB}"/>
      ${xLabels}
      <path d="${path}" fill="none" style="stroke:var(--accent);" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
    </svg>
  `;
}
function filteredPoints(){
  return statsAllPoints.filter(p => (!statsRange.from || p.date >= statsRange.from) && (!statsRange.to || p.date <= statsRange.to));
}
function updateChartUI(){
  const points = filteredPoints();
  const chartWrap = document.getElementById('chartWrap');
  const prBadge = document.getElementById('prBadge');
  const chartMeta = document.getElementById('chartMeta');
  if(!chartWrap) return;
  if(points.length === 0){
    chartWrap.innerHTML = `<div class="stat-empty">Nessun dato nell'intervallo di date selezionato.</div>`;
    chartMeta.innerHTML = ''; prBadge.style.display='none';
    return;
  }
  const pr = Math.max(...points.map(p=>p.kg));
  prBadge.textContent = `PR ${pr} kg`;
  prBadge.style.display = 'inline-block';
  if(points.length === 1){
    const p = points[0];
    chartWrap.innerHTML = `<div class="stat-empty">Una sola sessione nell'intervallo (${fmtDate(p.date)}: ${p.kg} kg × ${p.reps||'?'}).</div>`;

function cmChartSVG(points){
  const W = 340, H = 240;
  const mL = 34, mR = 12, mT = 16, mB = 34;
  const plotW = W - mL - mR, plotH = H - mT - mB;
  const vals = points.map(p=>p.cm);
  let yMin = Math.min(...vals), yMax = Math.max(...vals);
  if(yMin === yMax){ yMin -= 5; yMax += 5; }
  const step = niceStep(yMax - yMin) || 1;
  yMin = Math.floor(yMin/step)*step; yMax = Math.ceil(yMax/step)*step;
  if(yMin === yMax) yMax = yMin + step;
  const ticks = [];
  for(let v = yMin; v <= yMax + 0.001; v += step) ticks.push(Math.round(v*100)/100);
  const xFor = (i)=> points.length === 1 ? mL + plotW/2 : mL + (i/(points.length-1))*plotW;
  const yFor = (val)=> mT + (1 - (val-yMin)/(yMax-yMin)) * plotH;
  const gridLines = ticks.map(t=>{
    const y = yFor(t);
    return `<line class="chart-grid-line" x1="${mL}" y1="${y.toFixed(1)}" x2="${W-mR}" y2="${y.toFixed(1)}"/>
      <text class="chart-tick-label" x="${mL-6}" y="${(y+3).toFixed(1)}" text-anchor="end">${t}</text>`;
  }).join('');
  const showEveryLabel = points.length <= 7;
  const xLabels = points.map((p,i)=>{
    if(!showEveryLabel && i % Math.ceil(points.length/6) !== 0 && i !== points.length-1) return '';
    const x = xFor(i);
    return `<text class="chart-tick-label" x="${x.toFixed(1)}" y="${H-mB+16}" text-anchor="middle">${fmtDayMonth(p.date)}</text>`;
  }).join('');
  const coords = points.map((p,i)=>[xFor(i), yFor(p.cm)]);
  const path = coords.map((c,i)=> (i===0?'M':'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const dots = coords.map((c,i)=>`
      <circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="${i===coords.length-1?5:3.5}" style="fill:${i===coords.length-1?'var(--accent)':'var(--bg-elev)'};stroke:var(--accent);stroke-width:2;"/>
      ${points.length<=9?`<text class="chart-point-label" x="${c[0].toFixed(1)}" y="${(c[1]-10).toFixed(1)}" text-anchor="middle">${points[i].cm}</text>`:''}
  `).join('');
  return `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      ${gridLines}
      <line class="chart-axis-line" x1="${mL}" y1="${mT}" x2="${mL}" y2="${H-mB}"/>
      <line class="chart-axis-line" x1="${mL}" y1="${H-mB}" x2="${W-mR}" y2="${H-mB}"/>
      ${xLabels}
      <path d="${path}" fill="none" style="stroke:var(--teal);" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
    </svg>
  `;
}

const MESI_IT = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
async function getAllSessionsFlat(){
  const out = [];
  for(const g of allGiorni()){
    const sessions = await listSessionsDetailed(g.id);
    sessions.forEach(s=> out.push({
      giornoId: g.id,
      giornoLabel: s.log.giornoLabel || g.label,
      meta: s.log.giornoMeta || g.meta,
      date:s.date,
      sessionId:s.sessionId
    }));
  }
  out.sort((a,b)=> b.date.localeCompare(a.date) || b.sessionId.localeCompare(a.sessionId));
  return out;
}
async function renderCronologia(){
  state.screen = 'cronologia';

    </div>

  `;
  document.getElementById('btnBack').onclick = renderHome;
  await refreshCronologia();
}
async function refreshCronologia(){
  const sessions = await getAllSessionsFlat();
  const wrap = document.getElementById('cronWrap');
  if(!sessions.length){
    wrap.innerHTML = `<div class="cron-empty">Nessun allenamento salvato finora.<br>Registrane uno dalla sezione Cicli di allenamento.</div>`;
    return;
  }
  const groups = {};
  sessions.forEach(s=>{
    const ym = s.date.slice(0,7);
    if(!groups[ym]) groups[ym] = [];
    groups[ym].push(s);
  });
  const monthKeys = Object.keys(groups).sort().reverse();
  wrap.innerHTML = monthKeys.map(ym=>{
    const [y,m] = ym.split('-');
    const mi = parseInt(m)-1;
    const label = (MESI_IT[mi] && y) ? `${MESI_IT[mi]} ${y}` : 'Data sconosciuta';
    const dateCounts = {};
    groups[ym].forEach(s=>{ dateCounts[s.date] = (dateCounts[s.date]||0) + 1; });
    const rows = groups[ym].map(s=>{
      const d = new Date(s.date+'T00:00:00');
      const showTime = dateCounts[s.date] > 1;
      return `
        <div class="session-row" data-gid="${s.giornoId}" data-session="${s.sessionId}">
          <div class="sr-left">
            <div class="sr-date">${d.getDate()}</div>
            <div class="sr-info">
              <div class="sr-giorno">${s.giornoLabel} · ${s.meta}</div>
              <div class="sr-meta">${fmtDate(s.date)}${showTime ? ' · ' + sessionTimeLabel(s.sessionId) : ''}</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            <span style="color:var(--text-faint);display:flex;">${ICO.chev}</span>
            <button class="sr-del" data-gid="${s.giornoId}" data-session="${s.sessionId}">${ICO.trash}</button>
          </div>
        </div>
      `;
    }).join('');
    return `<div class="month-group"><div class="month-title">${label}</div>${rows}</div>`;
  }).join('');
  wrap.querySelectorAll('.session-row').forEach(row=>{
    row.addEventListener('click', async ()=>{
      await openExistingSession(row.dataset.gid, row.dataset.session);
    });
  });
  wrap.querySelectorAll('.sr-del').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const gid = btn.dataset.gid;
      const sessionId = btn.dataset.session;
      const rowDate = btn.closest('.session-row').querySelector('.sr-meta').textContent;
      showConfirm(`Eliminare questo allenamento (${rowDate})? L'operazione non può essere annullata e i dati spariranno anche dalle statistiche.`, async ()=>{
        await deleteSession(gid, sessionId);
        showToast('Sessione eliminata');
        await refreshCronologia();
      });
    });
  });
}
