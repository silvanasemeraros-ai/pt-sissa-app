function startTimerWithDuration(seconds, name){
  timer.total = seconds; timer.remaining = seconds;
  document.getElementById('timerSource').textContent = name || 'recupero';
  openTimerSheet(true);
}
function openTimerSheet(forceStart){
  document.getElementById('timerSheet').classList.add('open');
  document.getElementById('ringFg')?.classList.remove('done');
  if(forceStart || !timer.running) startTimer();
  else renderTimerBar();
}
function startTimer(){
  unlockAudioCtx();
  timer.running = true;
  timer.endTime = Date.now() + timer.remaining*1000;
  const tcT = document.getElementById('tcToggle'); if(tcT) tcT.innerHTML = ICO.pause;
  const rS1 = document.getElementById('ringStatus'); if(rS1) rS1.textContent = 'recupero';
  clearInterval(timer.intervalId);
  /* Tick ogni 250ms invece che ogni 1000ms: il valore mostrato non dipende
     comunque dal conteggio dei tick (si ricalcola sempre da endTime), ma un
     intervallo piu' frequente riduce lo scarto percepito quando il browser
     rallenta i timer in background e "recupera" piu' tick vicini insieme. */
  timer.intervalId = setInterval(()=>{
    const remain = Math.max(0, Math.round((timer.endTime - Date.now())/1000));
    timer.remaining = remain;
    if(remain <= 0){ finishTimer(); return; }
    updateRing();
  },250);
  updateRing();
  renderTimerBar();
}
function pauseTimer(){
  if(timer.running && timer.endTime){
    timer.remaining = Math.max(0, Math.round((timer.endTime - Date.now())/1000));
  }
  timer.running = false; clearInterval(timer.intervalId);
  const tcT2 = document.getElementById('tcToggle'); if(tcT2) tcT2.innerHTML = ICO.play;
  const rS2 = document.getElementById('ringStatus'); if(rS2) rS2.textContent = 'in pausa';
  renderTimerBar();
}
function toggleTimer(){ timer.running ? pauseTimer() : startTimer(); }
function resetTimer(){
  pauseTimer(); timer.remaining = timer.total;
  const rS3 = document.getElementById('ringStatus'); if(rS3) rS3.textContent = 'recupero';
  document.getElementById('ringFg')?.classList.remove('done');
  updateRing();
  renderTimerBar();
}
function adjustTimer(delta){
  timer.remaining = Math.max(0, timer.remaining + delta);
  timer.total = Math.max(timer.total, timer.remaining);
  if(timer.running) timer.endTime = Date.now() + timer.remaining*1000;
  updateRing();
  renderTimerBar();
}
function finishTimer(){
  pauseTimer();
  const rS4 = document.getElementById('ringStatus'); if(rS4) rS4.textContent = 'tempo scaduto!';
  document.getElementById('ringFg')?.classList.add('done');
  playFinishSound();
  if(navigator.vibrate) navigator.vibrate([300,150,300,150,300,150,300,150,300]);
  renderTimerBar();
}
/* Suono di fine recupero: una serie di beep per circa 2 secondi, cosi' si
   sente anche se in quel momento non si sta guardando il telefono. */
function playFinishSound(){
  try{
    const ctx = unlockAudioCtx();
    if(!ctx) return;
    const DURATION = 2.0, BEEP = 0.26, GAP = 0.2;
    for(let t = 0; t < DURATION; t += BEEP+GAP){
      const start = ctx.currentTime + t;
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, start);
      g.gain.linearRampToValueAtTime(0.18, start+0.02);
      g.gain.linearRampToValueAtTime(0.0001, start+BEEP);
      o.start(start); o.stop(start+BEEP+0.02);
    }
  }catch(e){}
}
function updateRing(){
  const circumference = 628;
  const pct = timer.total>0 ? timer.remaining/timer.total : 0;
  const m = Math.floor(timer.remaining/60).toString().padStart(2,'0');
  const s = (timer.remaining%60).toString().padStart(2,'0');
  const timeStr = `${m}:${s}`;
  const ring = document.getElementById('ringFg');
  const timeEl = document.getElementById('ringTime');
  if(ring && timeEl){
    ring.setAttribute('stroke-dashoffset', circumference*(1-pct));
    timeEl.textContent = timeStr;
  }
  const miniRing = document.getElementById('miniRingFg');
  const miniTime = document.getElementById('miniTime');
  if(miniRing && miniTime){
    const miniCircumference = 100.5;
    miniRing.setAttribute('stroke-dashoffset', miniCircumference*(1-pct));
    miniTime.textContent = timeStr;
  }
}

let statsAllPoints = [];
let statsRange = { from:null, to:null };
/* Un solo recupero, in parallelo su tutti i giorni/cicli, con il log completo
   di ogni sessione. Prima ogni schermata di statistiche rileggeva TUTTO lo
   storico fino a 3 volte separate (orfani, conteggio totale, storico

async function getAllSessionsRaw(){
  const results = await Promise.all(allGiorni().map(async (g)=>{
    const sessions = await listSessionsDetailed(g.id);
    return sessions.map(s=> ({ giorno:g, giornoId:g.id, sessionId:s.sessionId, date:s.date, log:s.log }));
  }));
  const out = results.flat();
  out.sort((a,b)=> b.date.localeCompare(a.date) || b.sessionId.localeCompare(a.sessionId));
  return out;
}
/* Trova negli storici salvati eventuali esercizi che non esistono più in NESSUN
   ciclo (attuale o precedente), così le loro statistiche restano comunque
   consultabili anche se l'id non è più definito da nessuna parte. */
function discoverOrphanExercisesFrom(raw){
  const orphans = {};
  raw.forEach(s=>{
    Object.keys(s.log.esercizi||{}).forEach(exId=>{
      if(!EXBYID[exId] && !orphans[exId]){
        orphans[exId] = { id:exId, name: s.log.esercizi[exId].name || exId, sc: s.log.esercizi[exId].sc || '' };
      }
    });
  });
  return orphans;
}
function getExerciseHistoryFrom(raw, exId){
  const points = [];
  raw.forEach(s=>{
    const entry = s.log.esercizi && s.log.esercizi[exId];
    if(!entry) return;
    let best = null;
    (entry.sets||[]).forEach(r=>{
      const kg = parseFloat(r.kg);
      if(!isNaN(kg) && (best === null || kg > best.kg)) best = {kg, reps:r.reps};
    });
    if(best) points.push({date:s.date, kg:best.kg, reps:best.reps, sessionId:s.sessionId});
  });
  points.sort((a,b)=> a.date.localeCompare(b.date));
  return points;
}
/* Versioni async standalone (stesso comportamento di prima), tenute per
   compatibilità: fanno il proprio recupero se richiamate isolatamente. */
async function discoverOrphanExercises(){ return discoverOrphanExercisesFrom(await getAllSessionsRaw()); }
async function getExerciseHistory(exId){ return getExerciseHistoryFrom(await getAllSessionsRaw(), exId); }
function niceStep(range){
  const raw = range/4;
  const pow = Math.pow(10, Math.floor(Math.log10(raw||1)));
  const norm = raw/pow;
  let step;
  if(norm < 1.5) step = 1; else if(norm < 3) step = 2; else if(norm < 7) step = 5; else step = 10;
  return step*pow;
}
function lineChartSVG(points){
  const W = 340, H = 240;
  const mL = 34, mR = 12, mT = 16, mB = 34;
  const plotW = W - mL - mR, plotH = H - mT - mB;
  const kgs = points.map(p=>p.kg);
  let yMin = Math.min(...kgs), yMax = Math.max(...kgs);
  if(yMin === yMax){ yMin -= 5; yMax += 5; }
  const step = niceStep(yMax - yMin) || 1;
  yMin = Math.floor(yMin/step)*step; yMax = Math.ceil(yMax/step)*step;
  if(yMin === yMax) yMax = yMin + step;
  const ticks = [];
  for(let v = yMin; v <= yMax + 0.001; v += step) ticks.push(Math.round(v*100)/100);
  const xFor = (i)=> points.length === 1 ? mL + plotW/2 : mL + (i/(points.length-1))*plotW;
  const yFor = (kg)=> mT + (1 - (kg-yMin)/(yMax-yMin)) * plotH;

function downloadTextFile(filename, text, mime){
  const blob = new Blob(['﻿' + text], { type: (mime || 'text/plain') + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function csvEscape(v){
  const s = String(v === undefined || v === null ? '' : v);
  return /[",;\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
async function exportAllenamentiCSV(){
  const rows = [['Data','Ciclo','Giorno','Esercizio','Serie #','Kg','Ripetizioni','RPE','Completata']];

  allRaw.forEach(s=>{
    const log = s.log, g = s.giorno;
    Object.values(log.esercizi || {}).forEach(ex=>{
      (ex.sets || []).forEach((set,i)=>{
        rows.push([log.date, log.cicloId || '', `${log.giornoLabel||g.label} · ${log.giornoMeta||g.meta}`, ex.name, i+1, set.kg||'', set.reps||'', set.rpe||'', set.done ? 'Sì' : 'No']);
      });
    });
  });
  if(rows.length === 1){ showToast('Nessun allenamento da esportare'); return; }
  const csv = rows.map(r=>r.map(csvEscape).join(';')).join('\n');
  downloadTextFile(`shape-track-allenamenti-${todayLocalISO()}.csv`, csv, 'text/csv');
  showToast('Esportazione avviata ✓');
}
async function exportMisureCSV(){

  downloadTextFile(`shape-track-misure-${todayLocalISO()}.csv`, csv, 'text/csv');

}

function cmChartSVG(points){
  const W = 340, H = 240;
  const mL = 34, mR = 12, mT = 16, mB = 34;
  const plotW = W - mL - mR, plotH = H - mT - mB;
  const vals = points.map(p=>p.cm);
  let yMin = Math.min(...vals), yMax = Math.max(...vals);
  if(yMin === yMax){ yMin -= 5; yMax += 5; }
  const step = niceStep(yMax - yMin) || 1;
  yMin = Math.floor(yMin/step)*step; yMax = Math.ceil(yMax/step)*step;
  if(yMin === yMax) yMax = yMin + step;
  const ticks = [];
  for(let v = yMin; v <= yMax + 0.001; v += step) ticks.push(Math.round(v*100)/100);
  const xFor = (i)=> points.length === 1 ? mL + plotW/2 : mL + (i/(points.length-1))*plotW;
  const yFor = (val)=> mT + (1 - (val-yMin)/(yMax-yMin)) * plotH;
  const gridLines = ticks.map(t=>{
    const y = yFor(t);
    return `<line class="chart-grid-line" x1="${mL}" y1="${y.toFixed(1)}" x2="${W-mR}" y2="${y.toFixed(1)}"/>
      <text class="chart-tick-label" x="${mL-6}" y="${(y+3).toFixed(1)}" text-anchor="end">${t}</text>`;
  }).join('');
  const showEveryLabel = points.length <= 7;
  const xLabels = points.map((p,i)=>{
    if(!showEveryLabel && i % Math.ceil(points.length/6) !== 0 && i !== points.length-1) return '';
    const x = xFor(i);
    return `<text class="chart-tick-label" x="${x.toFixed(1)}" y="${H-mB+16}" text-anchor="middle">${fmtDayMonth(p.date)}</text>`;
  }).join('');
  const coords = points.map((p,i)=>[xFor(i), yFor(p.cm)]);
  const path = coords.map((c,i)=> (i===0?'M':'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const dots = coords.map((c,i)=>`
      <circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="${i===coords.length-1?5:3.5}" style="fill:${i===coords.length-1?'var(--accent)':'var(--bg-elev)'};stroke:var(--accent);stroke-width:2;"/>
      ${points.length<=9?`<text class="chart-point-label" x="${c[0].toFixed(1)}" y="${(c[1]-10).toFixed(1)}" text-anchor="middle">${points[i].cm}</text>`:''}
  `).join('');
  return `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      ${gridLines}
      <line class="chart-axis-line" x1="${mL}" y1="${mT}" x2="${mL}" y2="${H-mB}"/>
      <line class="chart-axis-line" x1="${mL}" y1="${H-mB}" x2="${W-mR}" y2="${H-mB}"/>
      ${xLabels}
      <path d="${path}" fill="none" style="stroke:var(--teal);" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
    </svg>
  `;
}

    <div class="wrap">
      <div class="tab-row">
        <button class="tab-btn ${storicoTab==='allenamenti'?'active':''}" data-tab="allenamenti">Storico allenamenti</button>
        <button class="tab-btn ${storicoTab==='misure'?'active':''}" data-tab="misure">Storico misure</button>
      </div>
      <div class="swipe-hint">Scorri una voce verso sinistra per eliminarla</div>
      <div id="storicoBody"><div class="stat-empty" style="text-align:center;padding:40px 0;">Caricamento…</div></div>
    </div>
  `;
  document.getElementById('btnBack').onclick = renderAllenamento;
  app.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      storicoTab = btn.dataset.tab;
      app.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===storicoTab));
      renderStoricoBody();
    });
  });
  await renderStoricoBody();
}
async function renderStoricoBody(){
  const body = document.getElementById('storicoBody');
  if(!body) return;
  if(storicoTab === 'allenamenti'){
    body.innerHTML = `<div id="cronWrap"><div class="stat-empty" style="text-align:center;padding:40px 0;">Caricamento…</div></div>`;
    await refreshCronologia();
  } else {
    body.innerHTML = `<div id="misureList"><div class="stat-empty" style="text-align:center;padding:40px 0;">Caricamento…</div></div>`;
    await refreshMisureList();
  }
}
async function refreshCronologia(){
  const sessions = await getAllSessionsFlat();
  const wrap = document.getElementById('cronWrap');
  if(!wrap) return;
  if(!sessions.length){
    wrap.innerHTML = `<div class="cron-empty">Nessun allenamento salvato finora.<br>Registrane uno dalla sezione Cicli di allenamento.</div>`;
    return;
  }
  const groups = {};
  sessions.forEach(s=>{
    const ym = s.date.slice(0,7);
    if(!groups[ym]) groups[ym] = [];
    groups[ym].push(s);
  });
  const monthKeys = Object.keys(groups).sort().reverse();
  wrap.innerHTML = monthKeys.map(ym=>{
    const [y,m] = ym.split('-');
    const mi = parseInt(m)-1;
    const label = (MESI_IT[mi] && y) ? `${MESI_IT[mi]} ${y}` : 'Data sconosciuta';
    const dateCounts = {};
    groups[ym].forEach(s=>{ dateCounts[s.date] = (dateCounts[s.date]||0) + 1; });
    const rows = groups[ym].map(s=>{
      const d = new Date(s.date+'T00:00:00');
      const showTime = dateCounts[s.date] > 1;
      return `
        <div class="swipe-wrap" data-gid="${s.giornoId}" data-session="${s.sessionId}">
          <div class="swipe-action-bg">${ICO.trash}<span>Elimina</span></div>
          <div class="swipe-surface">
            <div class="session-row" data-gid="${s.giornoId}" data-session="${s.sessionId}">
              <div class="sr-left">
                <div class="sr-date">${d.getDate()}</div>
                <div class="sr-info">
                  <div class="sr-giorno">${s.giornoLabel} · ${s.meta}</div>
                  <div class="sr-meta">${fmtDate(s.date)}${showTime ? ' · ' + sessionTimeLabel(s.sessionId) : ''}</div>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:6px;">
                <button class="sr-edit" data-gid="${s.giornoId}" data-session="${s.sessionId}">${ICO.edit}</button>
                <button class="sr-del" data-gid="${s.giornoId}" data-session="${s.sessionId}">${ICO.trash}</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');
    return `<div class="month-group"><div class="month-title">${label}</div>${rows}</div>`;
  }).join('');
  wrap.querySelectorAll('.session-row').forEach(row=>{
    row.addEventListener('click', async ()=>{
      await openExistingSession(row.dataset.gid, row.dataset.session);
    });
  });
  wrap.querySelectorAll('.sr-edit').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      openExistingSession(btn.dataset.gid, btn.dataset.session);
    });
  });
  const doDelete = (gid, sessionId, rowDate)=>{
    showConfirm(`Eliminare questo allenamento (${rowDate})? L'operazione non può essere annullata e i dati spariranno anche dalle statistiche.`, async ()=>{
      try{
        await deleteSession(gid, sessionId);
        showToast('Sessione eliminata');
        await refreshCronologia();
      }catch(e){ showToast('Errore — impossibile eliminare, riprova'); }
    });
  };
  wrap.querySelectorAll('.sr-del').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const rowDate = btn.closest('.session-row').querySelector('.sr-meta').textContent;
      doDelete(btn.dataset.gid, btn.dataset.session, rowDate);
    });
  });
  wrap.querySelectorAll('.swipe-wrap').forEach(sw=>{
    enableSwipe(sw, ()=>{
      const rowDate = sw.querySelector('.sr-meta').textContent;
      doDelete(sw.dataset.gid, sw.dataset.session, rowDate);
    });
  });
}
/* ============== INIT / SESSIONE ============== */
auth.onAuthStateChanged((user)=>{
  currentUser = user;
  if(user){ renderHome(); }
  else { renderLogin(); }
});
</script>
